<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Orçamento & Finanças</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        /* Tema Claro (caso queira alternar) */
        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
        }

        @media (min-width: 450px) {
            .phone-container {
                height: 90vh;
                border-radius: 36px;
                border: 10px solid #1e293b;
            }
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        /* Cards de Resumo (Editáveis direto no clique) */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .card span {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
        }

        .card h2:hover {
            opacity: 0.8;
            text-decoration: underline dotted;
        }

        .card.cash h2 { color: #10b981; }
        .card.spent h2 { color: #f43f5e; }
        .card.card-val h2 { color: #38bdf8; }
        .card.euro h2 { color: #fbbf24; }

        /* Caixas de Ação e Formulários */
        .section-box {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .section-box h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 11px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        /* Lista de Gastos & Categorias */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--input-bg);
            border-radius: 10px;
            border-left: 5px solid #ccc;
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
        }

        .transaction-title {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .transaction-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .transaction-value {
            font-weight: bold;
            color: #f43f5e;
            font-size: 0.9rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .delete-btn:hover { color: #f43f5e; }

        .category-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body class="">

    <div class="phone-container">
        <header>
            <h1>Meus Gastos & Caixa</h1>
            <button class="theme-toggle" onclick="alternarTema()">🌙 Noite</button>
        </header>
        
        <div class="content">
            <!-- 4 Cards de Resumo (Valores editáveis ao clicar) -->
            <div class="summary-grid">
                <div class="card cash">
                    <span>Dinheiro em Caixa</span>
                    <h2 id="card-cash" onclick="editarValor('cash')" title="Clique para editar">R$ 5.000,00</h2>
                </div>
                <div class="card spent">
                    <span>Total Gasto (Mês)</span>
                    <h2 id="card-spent">R$ 0,00</h2>
                </div>
                <div class="card card-val">
                    <span>Cartão de Crédito</span>
                    <h2 id="card-credit" onclick="editarValor('credit')" title="Clique para editar">R$ 1.200,00</h2>
                </div>
                <div class="card euro">
                    <span>Valor em Euro (€)</span>
                    <h2 id="card-euro" onclick="editarValor('euro')" title="Clique para editar">€ 0,00</h2>
                </div>
            </div>

            <!-- Criar Categoria Colorida -->
            <div class="section-box">
                <h3>Criar Categoria</h3>
                <div class="form-group">
                    <input type="text" id="cat-name" placeholder="Nome (ex: Viagem, Escola)">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="color" id="cat-color" value="#6366f1" style="width: 44px; height: 42px; padding: 0; cursor: pointer; border-radius: 8px; border: 1px solid var(--border-color);">
                        <button class="btn-primary" onclick="adicionarCategoria()" style="flex: 1;">Adicionar Categoria</button>
                    </div>
                </div>
                <div class="category-badges" id="category-list-display"></div>
            </div>

            <!-- Lançamento de Gastos -->
            <div class="section-box">
                <h3>Novo Gasto</h3>
                <div class="form-group">
                    <input type="text" id="expense-desc" placeholder="O que foi gasto? (ex: Supermercado)">
                    <input type="number" id="expense-value" placeholder="Valor (R$)">
                    <select id="expense-category">
                        <option value="">Selecione a Categoria</option>
                    </select>
                    <select id="expense-payment">
                        <option value="Dinheiro/Caixa">Dinheiro / Caixa</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                    </select>
                    <button class="btn-primary" onclick="adicionarGasto()">Salvar Gasto</button>
                </div>
            </div>

            <!-- Extrato do Mês -->
            <div class="section-box">
                <h3>Extrato de Gastos</h3>
                <div class="transaction-list" id="transaction-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Dados principais salvos em memória ou localStorage
        let financialData = {
            cash: 5000.00,
            credit: 1200.00,
            euro: 250.00,
            categories: [
                { name: "Viagem", color: "#ec4899" },
                { name: "Escola", color: "#38bdf8" },
                { name: "Alimentação", color: "#f59e0b" }
            ],
            expenses: []
        };

        function atualizarTela() {
            // Calcular total gasto
            let totalGasto = financialData.expenses.reduce((acc, curr) => acc + curr.value, 0);
            
            // Atualizar textos dos cards
            document.getElementById("card-cash").innerText = `R$ ${financialData.cash.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("card-spent").innerText = `R$ ${totalGasto.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("card-credit").innerText = `R$ ${financialData.credit.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById("card-euro").innerText = `€ ${financialData.euro.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;

            // Atualizar Select de Categorias
            let select = document.getElementById("expense-category");
            select.innerHTML = '<option value="">Selecione a Categoria</option>';
            
            // Atualizar Badges de Categorias
            let badgeContainer = document.getElementById("category-list-display");
            badgeContainer.innerHTML = '';

            financialData.categories.forEach(cat => {
                let opt = document.createElement("option");
                opt.value = cat.name;
                opt.textContent = cat.name;
                select.appendChild(opt);

                let badge = document.createElement("div");
                badge.className = "badge";
                badge.style.backgroundColor = cat.color;
                badge.textContent = cat.name;
                badgeContainer.appendChild(badge);
            });

            // Atualizar Lista de Gastos
            let listContainer = document.getElementById("transaction-list");
            listContainer.innerHTML = '';

            if(financialData.expenses.length === 0) {
                listContainer.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 10px;">Nenhum gasto registrado.</span>';
                return;
            }

            financialData.expenses.forEach((exp, index) => {
                let catObj = financialData.categories.find(c => c.name === exp.category);
                let catColor = catObj ? catObj.color : '#ccc';

                let item = document.createElement("div");
                item.className = "transaction-item";
                item.style.borderLeftColor = catColor;

                item.innerHTML = `
                    <div class="transaction-info">
                        <span class="transaction-title">${exp.desc}</span>
                        <span class="transaction-meta">${exp.category || 'Geral'} • ${exp.payment}</span>
                    </div>
                    <div class="transaction-right">
                        <span class="transaction-value">- R$ ${exp.value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                        <button class="delete-btn" onclick="removerGasto(${index})">✕</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function editarValor(tipo) {
            let nomes = {
                cash: "Dinheiro em Caixa",
                credit: "Cartão de Crédito",
                euro: "Valor em Euro"
            };
            let valorAtual = financialData[tipo];
            let novoValorStr = prompt(`Digite o novo valor para ${nomes[tipo]}:`, valorAtual);
            
            if(novoValorStr !== null) {
                let novoValor = parseFloat(novoValorStr.replace(',', '.'));
                if(!isNaN(novoValor)) {
                    financialData[tipo] = novoValor;
                    atualizarTela();
                } else {
                    alert("Por favor, digite um número válido.");
                }
            }
        }

        function adicionarCategoria() {
            let nameInput = document.getElementById("cat-name");
            let colorInput = document.getElementById("cat-color");

            if(!nameInput.value.trim()) {
                alert("Digite o nome da categoria!");
                return;
            }

            financialData.categories.push({
                name: nameInput.value.trim(),
                color: colorInput.value
            });

            nameInput.value = '';
            atualizarTela();
        }

        function adicionarGasto() {
            let descInput = document.getElementById("expense-desc");
            let valueInput = document.getElementById("expense-value");
            let catSelect = document.getElementById("expense-category");
            let paySelect = document.getElementById("expense-payment");

            let valor = parseFloat(valueInput.value);

            if(!descInput.value.trim() || isNaN(valor) || valor <= 0) {
                alert("Preencha a descrição e um valor válido!");
                return;
            }

            financialData.expenses.push({
                desc: descInput.value.trim(),
                value: valor,
                category: catSelect.value,
                payment: paySelect.value
            });

            descInput.value = '';
            valueInput.value = '';
            catSelect.value = '';

            atualizarTela();
        }

        function removerGasto(index) {
            financialData.expenses.splice(index, 1);
            atualizarTela();
        }

        function alternarTema() {
            let body = document.body;
            let btn = document.querySelector(".theme-toggle");
            body.classList.toggle("light-mode");
            
            if(body.classList.contains("light-mode")) {
                btn.textContent = "☀️ Dia";
            } else {
                btn.textContent = "🌙 Noite";
            }
        }

        // Inicializar
        atualizarTela();
    </script>
</body>
</html>
