<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Finanças Pro Mobile</title>
  <meta name="description" content="Aplicativo de gestão financeira pessoal completo e autônomo para celular." />
  <meta name="theme-color" content="#4f46e5" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- Chassis do Smartphone -->
  <div id="phone-frame" class="w-full max-w-[430px] min-h-screen md:min-h-[890px] md:h-[92vh] flex flex-col relative overflow-hidden bg-slate-100 dark:bg-slate-950 md:rounded-[42px] md:border-[7px] md:border-slate-800 shadow-2xl transition-colors duration-300 dark">
    
    <!-- Barra Superior / Header -->
    <div class="pt-3 px-5 pb-2.5 flex justify-between items-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shrink-0 z-20">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black tracking-wider text-slate-800 dark:text-slate-100 uppercase">Finanças Pro</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="btn-privacy"
          type="button"
          class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform cursor-pointer"
          title="Ocultar / Revelar Valores (Privacidade)"
        >
          👁️
        </button>

        <button
          id="btn-theme"
          type="button"
          class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform cursor-pointer"
          title="Alternar Tema Claro / Escuro"
        >
          ☀️
        </button>
      </div>
    </div>

    <!-- Navegação de Mês/Ano -->
    <div class="px-4 py-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs font-bold shrink-0">
      <button id="btn-prev-month" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer">
        ◀
      </button>
      <div id="month-label" class="text-center font-extrabold text-slate-900 dark:text-slate-100">
        Janeiro de 2026
      </div>
      <button id="btn-next-month" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer">
        ▶
      </button>
    </div>

    <!-- Conteúdo da Aba Ativa -->
    <div id="view-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
      <!-- Injetado dinamicamente via JS Puro -->
    </div>

    <!-- Barra Inferior de Abas (Fixa) -->
    <div class="absolute bottom-0 left-0 right-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex justify-around items-center px-2 z-20">
      <button data-tab="painel" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-indigo-600 dark:text-indigo-400 font-black">
        <span class="text-lg leading-none">📊</span>
        <span class="text-[10px] mt-0.5">Painel</span>
      </button>
      <button data-tab="lancar" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">➕</span>
        <span class="text-[10px] mt-0.5">Lançar</span>
      </button>
      <button data-tab="cartoes" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">💳</span>
        <span class="text-[10px] mt-0.5">Cartões</span>
      </button>
      <button data-tab="meses" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">📅</span>
        <span class="text-[10px] mt-0.5">Meses</span>
      </button>
      <button data-tab="mais" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">⚙️</span>
        <span class="text-[10px] mt-0.5">Mais</span>
      </button>
    </div>

    <!-- Notificação Toast -->
    <div id="toast" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-black px-4 py-2 rounded-full shadow-2xl border border-slate-700 dark:border-slate-300 pointer-events-none transition-all">
      Notificação
    </div>

  </div>

  <!-- JAVASCRIPT PURO (ZERO FRAMEWORKS / ZERO REACT) -->
  <script>
    (function () {
      const STORAGE_KEY = 'FINANCAS_PRO_DATA_GITHUB_PAGES';
      const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

      const DEFAULT_DATA = {
        boxes: [
          { id: '1', name: 'Salário / Geral', limit: 5000, color: '#6366f1', icon: '💼', isMain: true },
          { id: '2', name: 'Alimentação', limit: 1200, color: '#10b981', icon: '🍔', isMain: false },
          { id: '3', name: 'Transporte', limit: 400, color: '#f59e0b', icon: '🚗', isMain: false },
          { id: '4', name: 'Lazer e Streaming', limit: 500, color: '#ec4899', icon: '🎮', isMain: false },
          { id: '5', name: 'Saúde e Farmácia', limit: 350, color: '#06b6d4', icon: '💊', isMain: false }
        ],
        creditCards: [
          {
            id: 'card-1',
            name: 'Nubank Ultravioleta',
            limit: 8500,
            color: '#6b21a8',
            brand: 'Mastercard Black',
            skin: 'ultraviolet',
            cvv: '849',
            isBlocked: false
          },
          {
            id: 'card-2',
            name: 'Inter Black Win',
            limit: 15000,
            color: '#0f172a',
            brand: 'Mastercard Platinum',
            skin: 'titanium',
            cvv: '312',
            isBlocked: false
          }
        ],
        transactions: [
          { id: 1, desc: 'Salário Mensal', value: 5000, type: 'receita', boxId: '1', category: 'Salário', payment: 'Pix', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 2, desc: 'Supermercado Mensal', value: 480, type: 'despesa', boxId: '2', category: 'Supermercado', payment: 'Cartão de Crédito', cardId: 'card-1', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 3, desc: 'Combustível Posto', value: 160, type: 'despesa', boxId: '3', category: 'Transporte', payment: 'Débito', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 4, desc: 'Jantar Restaurante', value: 120, type: 'despesa', boxId: '4', category: 'Lazer', payment: 'Cartão de Crédito', cardId: 'card-1', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 }
        ],
        savingsGoals: [
          { id: 1, name: 'Reserva de Emergência', targetValue: 15000, currentValue: 6500, color: '#10b981', icon: '🛡️' },
          { id: 2, name: 'Viagem de Fim de Ano', targetValue: 5000, currentValue: 1800, color: '#06b6d4', icon: '✈️' }
        ],
        recurringBills: [
          { id: '1', name: 'Netflix 4K Ultra', value: 55.90, dueDay: 12, icon: '🍿' },
          { id: '2', name: 'Spotify Duo', value: 34.90, dueDay: 20, icon: '🎵' },
          { id: '3', name: 'Internet Fibra 600MB', value: 129.90, dueDay: 10, icon: '🌐' }
        ]
      };

      // Estado Global da Aplicação
      const state = {
        data: loadData(),
        currentYear: new Date().getFullYear(),
        currentMonth: new Date().getMonth() + 1,
        currentTab: 'painel',
        privacyMode: false,
        darkMode: true,
        revealedCvv: {},
        showSimulator: false,
        simDiscount: 5,
        simCdi: 0.9,
        newTransType: 'despesa'
      };

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : DEFAULT_DATA;
        } catch {
          return DEFAULT_DATA;
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        } catch (e) {
          console.error(e);
        }
      }

      function formatMoeda(num) {
        if (state.privacyMode) return 'R$ ••••••';
        return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      let toastTimeout = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('hidden');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.add('hidden');
        }, 3000);
      }

      // Elementos Principais
      const phoneFrame = document.getElementById('phone-frame');
      const viewContent = document.getElementById('view-content');
      const monthLabel = document.getElementById('month-label');
      const btnPrivacy = document.getElementById('btn-privacy');
      const btnTheme = document.getElementById('btn-theme');
      const btnPrevMonth = document.getElementById('btn-prev-month');
      const btnNextMonth = document.getElementById('btn-next-month');
      const tabButtons = document.querySelectorAll('.tab-btn');

      // Listeners do Topo
      btnPrivacy.addEventListener('click', () => {
        state.privacyMode = !state.privacyMode;
        btnPrivacy.textContent = state.privacyMode ? '🙈' : '👁️';
        render();
      });

      btnTheme.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        if (state.darkMode) {
          phoneFrame.classList.add('dark');
          btnTheme.textContent = '☀️';
        } else {
          phoneFrame.classList.remove('dark');
          btnTheme.textContent = '🌙';
        }
      });

      btnPrevMonth.addEventListener('click', () => {
        if (state.currentMonth === 1) {
          state.currentMonth = 12;
          state.currentYear--;
        } else {
          state.currentMonth--;
        }
        render();
      });

      btnNextMonth.addEventListener('click', () => {
        if (state.currentMonth === 12) {
          state.currentMonth = 1;
          state.currentYear++;
        } else {
          state.currentMonth++;
        }
        render();
      });

      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentTab = btn.getAttribute('data-tab');
          tabButtons.forEach(b => {
            const isCur = b.getAttribute('data-tab') === state.currentTab;
            b.className = `tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer ${
              isCur ? 'text-indigo-600 dark:text-indigo-400 font-black' : 'text-slate-400 font-bold'
            }`;
          });
          render();
        });
      });

      // Funções de Negócio Globais
      window.quickLancar = function (desc, val, cat) {
        state.data.transactions.unshift({
          id: Date.now(),
          desc,
          value: val,
          type: 'despesa',
          boxId: '1',
          category: cat,
          payment: 'Pix',
          date: new Date().toISOString().slice(0, 10),
          year: state.currentYear,
          month: state.currentMonth
        });
        saveData();
        showToast(`Lançado: ${desc} (${formatMoeda(val)})! ⚡`);
        render();
      };

      window.toggleCardLock = function (id) {
        const card = state.data.creditCards.find(c => c.id === id);
        if (card) {
          card.isBlocked = !card.isBlocked;
          saveData();
          showToast(card.isBlocked ? 'Cartão Bloqueado! 🔒' : 'Cartão Desbloqueado! 🔓');
          render();
        }
      };

      window.cycleCardSkin = function (id) {
        const skins = ['titanium', 'ultraviolet', 'emerald', 'gold', 'midnight'];
        const card = state.data.creditCards.find(c => c.id === id);
        if (card) {
          const idx = skins.indexOf(card.skin || 'titanium');
          card.skin = skins[(idx + 1) % skins.length];
          saveData();
          showToast(`Skin alterada para ${card.skin.toUpperCase()}! 🎨`);
          render();
        }
      };

      window.toggleCvv = function (id) {
        state.revealedCvv[id] = !state.revealedCvv[id];
        render();
      };

      window.deleteTrans = function (id) {
        if (confirm('Deseja excluir este lançamento?')) {
          state.data.transactions = state.data.transactions.filter(t => t.id !== id);
          saveData();
          showToast('Lançamento excluído!');
          render();
        }
      };

      window.alterarMeta = function (id, tipo) {
        const valStr = prompt(tipo === 'add' ? 'Valor para guardar na reserva (R$):' : 'Valor para resgatar da reserva (R$):');
        const val = parseFloat(valStr);
        if (isNaN(val) || val <= 0) return;

        const goal = state.data.savingsGoals.find(g => g.id === id);
        if (goal) {
          if (tipo === 'resgatar' && val > goal.currentValue) {
            alert('Valor de resgate excede o saldo acumulado!');
            return;
          }
          goal.currentValue = tipo === 'add' ? goal.currentValue + val : goal.currentValue - val;
          saveData();
          showToast(tipo === 'add' ? `Guardado ${formatMoeda(val)}! 🐖` : `Resgatado ${formatMoeda(val)}! 💸`);
          render();
        }
      };

      window.shareWhatsApp = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        const rec = monthTrans.filter(t => t.type === 'receita').reduce((a, b) => a + (b.value || 0), 0);
        const desp = monthTrans.filter(t => t.type === 'despesa').reduce((a, b) => a + (b.value || 0), 0);
        const cartao = monthTrans.filter(t => t.type === 'despesa' && t.payment === 'Cartão de Crédito').reduce((a, b) => a + (b.value || 0), 0);
        const sobra = rec - desp;

        const lines = [
          `📊 *Resumo Financeiro - ${MONTHS[state.currentMonth - 1]} / ${state.currentYear}*`,
          `━━━━━━━━━━━━━━━━━━━━━━━━━`,
          `💰 *Receitas:* ${formatMoeda(rec)}`,
          `📉 *Despesas:* ${formatMoeda(desp)}`,
          `💳 *No Cartão:* ${formatMoeda(cartao)}`,
          `🟢 *Sobra Líquida:* ${formatMoeda(sobra)}`,
          `━━━━━━━━━━━━━━━━━━━━━━━━━`,
          `📑 *Lançamentos do Mês (${monthTrans.length}):*`,
          ...monthTrans.slice(0, 10).map(t => `• ${t.desc}: ${formatMoeda(t.value)} (${t.payment})`),
          monthTrans.length > 10 ? `... e mais ${monthTrans.length - 10} outros.` : '',
          `━━━━━━━━━━━━━━━━━━━━━━━━━`,
          `Gerado por Finanças Pro Mobile ✨`
        ].filter(Boolean);

        const text = lines.join('\n');
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          showToast('Resumo copiado para o WhatsApp! 📲');
        } else {
          alert('Resumo:\n\n' + text);
        }
      };

      window.exportCSV = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        if (monthTrans.length === 0) {
          alert('Nenhum lançamento para exportar!');
          return;
        }
        const rows = [
          ['Data', 'Descricao', 'Tipo', 'Categoria', 'Forma', 'Valor'],
          ...monthTrans.map(t => [t.date, t.desc, t.type, t.category, t.payment, t.value.toFixed(2)])
        ];
        const csvContent = '\uFEFF' + rows.map(e => e.join(';')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `extrato_${state.currentMonth}_${state.currentYear}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('Planilha CSV baixada! 📊');
      };

      window.copyBackup = function () {
        const json = JSON.stringify(state.data, null, 2);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(json);
          showToast('Backup copiado para a Área de Transferência! 📋');
        } else {
          prompt('Copie seu código de backup abaixo:', json);
        }
      };

      window.restoreBackup = function () {
        const text = prompt('Cole aqui o texto JSON do backup:');
        if (text) {
          try {
            const parsed = JSON.parse(text);
            if (parsed && typeof parsed === 'object') {
              state.data = parsed;
              saveData();
              showToast('Backup restaurado com sucesso! 🎉');
              render();
            }
          } catch {
            alert('Formato JSON inválido.');
          }
        }
      };

      window.resetData = function () {
        if (confirm('Tem certeza que deseja zerar todos os dados e restaurar o app de fábrica?')) {
          state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveData();
          showToast('Dados restaurados de fábrica!');
          render();
        }
      };

      window.goToMonth = function (m) {
        state.currentMonth = m;
        state.currentTab = 'painel';
        tabButtons.forEach(b => {
          const isCur = b.getAttribute('data-tab') === 'painel';
          b.className = `tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer ${
            isCur ? 'text-indigo-600 dark:text-indigo-400 font-black' : 'text-slate-400 font-bold'
          }`;
        });
        render();
      };

      // MOTOR DE RENDERIZAÇÃO DECLARATIVO
      function render() {
        monthLabel.textContent = `${MONTHS[state.currentMonth - 1]} de ${state.currentYear}`;

        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        const totalReceitas = monthTrans.filter(t => t.type === 'receita').reduce((a, b) => a + (b.value || 0), 0);
        const totalDespesas = monthTrans.filter(t => t.type === 'despesa').reduce((a, b) => a + (b.value || 0), 0);
        const totalCartao = monthTrans.filter(t => t.type === 'despesa' && t.payment === 'Cartão de Crédito').reduce((a, b) => a + (b.value || 0), 0);
        const sobraLiquida = totalReceitas - totalDespesas;

        let healthScore = 480;
        if (totalReceitas > 0) {
          const poupancaRatio = Math.max(0, sobraLiquida / totalReceitas);
          const cartaoRatio = totalCartao / totalReceitas;
          healthScore = Math.min(990, Math.max(220, Math.round(poupancaRatio * 600 + (1 - Math.min(1, cartaoRatio)) * 400)));
        }

        let html = '';

        // 1. ABA PAINEL
        if (state.currentTab === 'painel') {
          html = `
            <div class="space-y-4">
              <!-- Cartões de Métricas -->
              <div class="grid grid-cols-2 gap-2.5">
                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white shadow-md">
                  <span class="text-[10px] font-bold text-indigo-100 uppercase tracking-wider block">Verba / Receitas</span>
                  <span class="text-base font-black tracking-tight">${formatMoeda(totalReceitas)}</span>
                </div>

                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-rose-500 to-rose-700 text-white shadow-md">
                  <span class="text-[10px] font-bold text-rose-100 uppercase tracking-wider block">Total Gasto</span>
                  <span class="text-base font-black tracking-tight">${formatMoeda(totalDespesas)}</span>
                </div>

                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-purple-600 to-violet-800 text-white shadow-md">
                  <span class="text-[10px] font-bold text-purple-100 uppercase tracking-wider block">Fatura Cartões</span>
                  <span class="text-base font-black tracking-tight">${formatMoeda(totalCartao)}</span>
                </div>

                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white shadow-md">
                  <span class="text-[10px] font-bold text-emerald-100 uppercase tracking-wider block">Sobra Líquida</span>
                  <span class="text-base font-black tracking-tight">${formatMoeda(sobraLiquida)}</span>
                </div>
              </div>

              <!-- Lançamentos Rápidos -->
              <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="quickLancar('Mercado Express', 80, 'Alimentação')" class="py-1 px-3 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-[11px] font-bold whitespace-nowrap shadow-2xs hover:border-indigo-400 cursor-pointer">
                  🛒 Mercado R$ 80
                </button>
                <button onclick="quickLancar('Combustível', 100, 'Transporte')" class="py-1 px-3 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-[11px] font-bold whitespace-nowrap shadow-2xs hover:border-indigo-400 cursor-pointer">
                  ⛽ Posto R$ 100
                </button>
                <button onclick="quickLancar('Delivery / Lanche', 45, 'Alimentação')" class="py-1 px-3 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-[11px] font-bold whitespace-nowrap shadow-2xs hover:border-indigo-400 cursor-pointer">
                  🍕 Lanche R$ 45
                </button>

            const desc = parseFloat(simDiscountInput.value) || 0;
            const cdi = parseFloat(simCdiInput.value) || 0;

            if (val > 0) {
              const economiaAvista = val * (desc / 100);
              const rendimentoCdi = val * ((cdi / 100) * (parcelas / 2));
              const valeAvista = economiaAvista >= rendimentoCdi;

              simVerdict.innerHTML = `
                <div>💡 Desconto à vista: <b>${formatMoeda(economiaAvista)}</b></div>
                <div>📈 Rende no CDI (${parcelas}x): <b>~${formatMoeda(rendimentoCdi)}</b></div>
                <div class="mt-1.5 p-1.5 rounded-lg text-center ${valeAvista ? 'bg-emerald-500/20 text-emerald-400' : 'bg-indigo-500/20 text-indigo-400'}">
                  ${valeAvista ? '🏆 Recomendação: Pague À VISTA com desconto!' : '🏆 Recomendação: PARCELE sem juros e deixe no CDI!'}
                </div>
              `;
            } else {
              simVerdict.textContent = 'Informe o valor acima para comparar a economia do desconto com o ganho no CDI.';
            }
          }

          btnToggleSim.addEventListener('click', () => {
            state.showSimulator = !state.showSimulator;
            simBox.classList.toggle('hidden', !state.showSimulator);
            simIndicator.textContent = state.showSimulator ? 'Fechar' : 'Calcular';
            if (state.showSimulator) updateSimulator();
          });

          inputValor.addEventListener('input', updateSimulator);
          inputParcelas.addEventListener('change', updateSimulator);
          simDiscountInput.addEventListener('input', updateSimulator);
          simCdiInput.addEventListener('input', updateSimulator);

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('input-desc').value.trim();
            const val = parseFloat(document.getElementById('input-valor').value);
            const parcelas = parseInt(document.getElementById('input-parcelas').value, 10) || 1;
            const boxId = document.getElementById('input-caixinha').value;
            const payment = document.getElementById('input-pagamento').value;
            const cardId = document.getElementById('input-cartao')?.value;

            if (!desc || isNaN(val) || val <= 0) {
              showToast('Informe a descrição e valor válidos!');
              return;
            }

            if (payment === 'Cartão de Crédito') {
              const cardObj = state.data.creditCards.find(c => c.id === cardId);
              if (cardObj && cardObj.isBlocked) {
                showToast(`⚠️ O cartão "${cardObj.name}" está bloqueado!`);
                return;
              }
            }

            const valorPorParcela = +(val / parcelas).toFixed(2);
            for (let i = 0; i < parcelas; i++) {
              let lancMes = state.currentMonth + i;
              let lancAno = state.currentYear;
              while (lancMes > 12) {
                lancMes -= 12;
                lancAno++;
              }
              state.data.transactions.unshift({
                id: Date.now() + i,
                desc: parcelas > 1 ? `${desc} (${i + 1}/${parcelas})` : desc,
                value: valorPorParcela,
                type: state.newTransType,
                boxId,
                category: 'Geral',
                payment,
                cardId: payment === 'Cartão de Crédito' ? cardId : undefined,
                date: new Date().toISOString().slice(0, 10),
                year: lancAno,
                month: lancMes
              });
            }

            saveData();
            showToast(parcelas > 1 ? `${parcelas} parcelas cadastradas!` : 'Lançamento salvo!');
            render();
          });
        }
      }

      // Inicialização
      render();
    })();
  </script>
</body>
</html>
