<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finanças Pro Mobile</title>
  <meta name="description" content="Aplicativo de gestão financeira pessoal completo e 100% editável para celular." />
  <meta name="theme-color" content="#4f46e5" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }
    #nav-indicator {
      position: absolute;
      top: 6px;
      left: 0;
      height: calc(100% - 12px);
      width: 20%;
      border-radius: 1rem;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 antialiased min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- FRAME DO SMARTPHONE (Inicia no Branco / Light Mode) -->
  <div id="phone-frame" class="w-full max-w-[430px] min-h-screen md:min-h-[890px] md:h-[92vh] flex flex-col relative overflow-hidden bg-slate-50 dark:bg-slate-950 md:rounded-[42px] md:border-[7px] md:border-slate-800 shadow-2xl transition-colors duration-300">
    
    <!-- HEADER -->
    <header class="pt-3 px-5 pb-2.5 flex justify-between items-center bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shrink-0 z-20">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black tracking-wider text-slate-800 dark:text-slate-100 uppercase">Finanças Pro</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="btn-privacy"
          type="button"
          class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 active:scale-90 transition-transform cursor-pointer"
          title="Ocultar / Mostrar Valores"
        >
          👁️
        </button>

        <button
          id="btn-theme"
          type="button"
          class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 active:scale-90 transition-transform cursor-pointer"
          title="Alternar Tema Claro / Escuro"
        >
          🌙
        </button>
      </div>
    </header>

    <!-- NAVEGAÇÃO DE MÊS/ANO -->
    <div class="px-4 py-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs font-bold shrink-0">
      <button id="btn-prev-month" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 active:scale-95 transition-transform cursor-pointer">
        ◀
      </button>
      <div id="month-label" class="text-center font-black text-slate-800 dark:text-slate-100">
        Carregando...
      </div>
      <button id="btn-next-month" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 active:scale-95 transition-transform cursor-pointer">
        ▶
      </button>
    </div>

    <!-- VIEWPORT COM PADDING-BOTTOM PARA NÃO TAPAR BOTÕES -->
    <main id="view-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 md:pb-20">
      <!-- Injetado dinamicamente -->
    </main>

    <!-- BARRA INFERIOR DE ABAS COM INDICADOR SUAVE -->
    <nav class="relative w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex items-center px-2 py-1.5 shrink-0 sticky bottom-0 z-30 shadow-lg pb-[max(env(safe-area-inset-bottom),0.5rem)]">
      <!-- Fundo deslizante animado -->
      <div id="nav-indicator" class="bg-indigo-500/15 dark:bg-indigo-400/20 border border-indigo-500/25"></div>

      <button data-tab="painel" data-index="0" class="tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer text-indigo-600 dark:text-indigo-400 font-black">
        <span class="text-lg leading-none transition-transform">📊</span>
        <span class="text-[10px] mt-0.5">Painel</span>
      </button>
      <button data-tab="lancar" data-index="1" class="tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none transition-transform">➕</span>
        <span class="text-[10px] mt-0.5">Lançar</span>
      </button>
      <button data-tab="cartoes" data-index="2" class="tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none transition-transform">💳</span>
        <span class="text-[10px] mt-0.5">Cartões</span>
      </button>
      <button data-tab="meses" data-index="3" class="tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none transition-transform">📅</span>
        <span class="text-[10px] mt-0.5">Meses</span>
      </button>
      <button data-tab="mais" data-index="4" class="tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none transition-transform">⚙️</span>
        <span class="text-[10px] mt-0.5">Mais</span>
      </button>
    </nav>

    <!-- NOTIFICAÇÃO TOAST FLUTUANTE -->
    <div id="toast" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 text-xs font-black px-4 py-2 rounded-full shadow-2xl border border-slate-700 dark:border-slate-300 pointer-events-none transition-all">
      Notificação
    </div>

    <!-- MODAL CONTAINER DINÂMICO -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
      <div id="modal-box" class="w-full max-w-[380px] bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
        <!-- Injetado por JS -->
      </div>
    </div>

  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'FINANCAS_PRO_DATA_AUTONOMO';
      const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

      const DEFAULT_DATA = {
        boxes: [
          { id: '1', name: 'Salário / Geral', limit: 5000, color: '#6366f1', icon: '💼', isMain: true },
          { id: '2', name: 'Alimentação', limit: 1200, color: '#10b981', icon: '🍔', isMain: false },
          { id: '3', name: 'Transporte', limit: 400, color: '#f59e0b', icon: '🚗', isMain: false },
          { id: '4', name: 'Lazer e Streaming', limit: 500, color: '#ec4899', icon: '🎮', isMain: false },
          { id: '5', name: 'Saúde e Farmácia', limit: 350, color: '#06b6d4', icon: '💊', isMain: false }
        ],
        quickButtons: [
          { desc: 'Mercado Express', val: 80, cat: 'Alimentação', icon: '🛒' },
          { desc: 'Combustível Posto', val: 100, cat: 'Transporte', icon: '⛽' },
          { desc: 'Delivery / Lanche', val: 45, cat: 'Alimentação', icon: '🍕' },
          { desc: 'Farmácia', val: 50, cat: 'Saúde e Farmácia', icon: '💊' }
        ],
        creditCards: [
          { id: 'card-1', name: 'Nubank Ultravioleta', limit: 8500, color: '#6b21a8', brand: 'Mastercard Black', skin: 'ultraviolet', cvv: '849', isBlocked: false },
          { id: 'card-2', name: 'Inter Black Win', limit: 15000, color: '#0f172a', brand: 'Mastercard Platinum', skin: 'titanium', cvv: '312', isBlocked: false }
        ],
        transactions: [
          { id: 1, desc: 'Salário Mensal', value: 5000, type: 'receita', boxId: '1', category: 'Salário', payment: 'Pix', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 2, desc: 'Supermercado Mensal', value: 480, type: 'despesa', boxId: '2', category: 'Alimentação', payment: 'Cartão de Crédito', cardId: 'card-1', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 3, desc: 'Combustível Posto', value: 160, type: 'despesa', boxId: '3', category: 'Transporte', payment: 'Débito', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 4, desc: 'Notebook Dell (3/10)', value: 250, type: 'despesa', boxId: '1', category: 'Compras Parceladas', payment: 'Cartão de Crédito', cardId: 'card-1', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 }
        ],
        savingsGoals: [
          { id: 1, name: 'Reserva de Emergência', targetValue: 15000, currentValue: 6500, color: '#10b981', icon: '🛡️' },
          { id: 2, name: 'Viagem de Fim de Ano', targetValue: 5000, currentValue: 1800, color: '#06b6d4', icon: '✈️' }
        ],
        recurringBills: [
          { id: '1', name: 'Netflix 4K Ultra', value: 55.90, dueDay: 12, icon: '🍿' },
          { id: '2', name: 'Spotify Duo', value: 34.90, dueDay: 20, icon: '🎵' },
          { id: '3', name: 'Internet Fibra 600MB', value: 129.90, dueDay: 10, icon: '🌐' }
        ]
      };

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_DATA;
          const parsed = JSON.parse(raw);
          if (!parsed.quickButtons) parsed.quickButtons = DEFAULT_DATA.quickButtons;
          return parsed;
        } catch {
          return DEFAULT_DATA;
        }
      }

      const state = {
        data: loadData(),
        currentYear: new Date().getFullYear(),
        currentMonth: new Date().getMonth() + 1,
        currentTab: 'painel',
        privacyMode: false,
        darkMode: false, // Inicia no modo claro / branco
        revealedCvv: {},
        showSimulator: false,
        simDiscount: 5,
        simCdi: 0.9,
        newTransType: 'despesa'
      };

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        } catch (e) {
          console.error(e);
        }
      }

      function formatMoeda(num) {
        if (state.privacyMode) return 'R$ ••••••';
        return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      let toastTimeout = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('hidden');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.add('hidden');
        }, 3200);
      }

      const phoneFrame = document.getElementById('phone-frame');
      const viewContent = document.getElementById('view-content');
      const monthLabel = document.getElementById('month-label');
      const btnPrivacy = document.getElementById('btn-privacy');
      const btnTheme = document.getElementById('btn-theme');
      const btnPrevMonth = document.getElementById('btn-prev-month');
      const btnNextMonth = document.getElementById('btn-next-month');
      const tabButtons = document.querySelectorAll('.tab-btn');
      const navIndicator = document.getElementById('nav-indicator');
      const modalContainer = document.getElementById('modal-container');
      const modalBox = document.getElementById('modal-box');

      function updateNavIndicator() {
        const tabs = ['painel', 'lancar', 'cartoes', 'meses', 'mais'];
        const idx = tabs.indexOf(state.currentTab);
        if (idx !== -1 && navIndicator) {
          navIndicator.style.transform = `translateX(${idx * 100}%)`;
        }
      }

      btnPrivacy.addEventListener('click', () => {
        state.privacyMode = !state.privacyMode;
        btnPrivacy.textContent = state.privacyMode ? '🙈' : '👁️';
        render();
      });

      btnTheme.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        if (state.darkMode) {
          phoneFrame.classList.add('dark');
          btnTheme.textContent = '☀️';
        } else {
          phoneFrame.classList.remove('dark');
          btnTheme.textContent = '🌙';
        }
      });

      btnPrevMonth.addEventListener('click', () => {
        if (state.currentMonth === 1) {
          state.currentMonth = 12;
          state.currentYear--;
        } else {
          state.currentMonth--;
        }
        render();
      });

      btnNextMonth.addEventListener('click', () => {
        if (state.currentMonth === 12) {
          state.currentMonth = 1;
          state.currentYear++;
        } else {
          state.currentMonth++;
        }
        render();
      });

      function switchTab(tabKey) {
        state.currentTab = tabKey;
        tabButtons.forEach(b => {
          const isCur = b.getAttribute('data-tab') === state.currentTab;
          b.className = 'tab-btn relative z-10 flex-1 flex flex-col items-center justify-center py-1 transition-all cursor-pointer ' +
            (isCur ? 'text-indigo-600 dark:text-indigo-400 font-black scale-105' : 'text-slate-400 font-bold scale-100');
        });
        updateNavIndicator();
        render();
      }

      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.getAttribute('data-tab'));
        });
      });

      window.closeModal = function() {
        modalContainer.classList.add('hidden');
        modalBox.innerHTML = '';
      };

      modalContainer.addEventListener('click', (e) => {
        if (e.target === modalContainer) closeModal();
      });

      // MODAL: NOVO BOTÃO DE LANÇAMENTO RÁPIDO
      window.openModalNovoQuick = function() {
        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>⚡</span>
            <span>Novo Lançamento Rápido</span>
          </h3>
          <p class="text-[11px] text-slate-500">Crie botões de 1 toque para despesas frequentes do dia a dia.</p>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Emoji / Ícone:</label>
            <input type="text" id="m-quick-icon" value="☕" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Descrição do Lançamento:</label>
            <input type="text" id="m-quick-desc" placeholder="Ex: Café na Padaria" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Valor Padrão (R$):</label>
            <input type="number" step="0.5" id="m-quick-val" placeholder="Ex: 15.00" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Categoria / Caixinha:</label>
            <select id="m-quick-cat" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700">
              ${state.data.boxes.map(b => `<option value="${b.name}">${b.icon} ${b.name}</option>`).join('')}
            </select>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveNovoQuick()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Criar Botão</button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveNovoQuick = function() {
        const icon = document.getElementById('m-quick-icon').value.trim() || '⚡';
        const desc = document.getElementById('m-quick-desc').value.trim();
        const val = parseFloat(document.getElementById('m-quick-val').value);
        const cat = document.getElementById('m-quick-cat').value;
        if (!desc || isNaN(val) || val <= 0) return alert('Preencha os campos com valores válidos.');

        state.data.quickButtons.push({ icon, desc, val, cat });
        saveData();
        closeModal();
        showToast('Novo atalho rápido criado!');
        render();
      };

      // MODAL: EDIÇÃO DE SALÁRIO
      window.openModalEditarSalario = function() {
        let mainBox = state.data.boxes.find(b => b.isMain) || state.data.boxes[0];
        const currentVal = mainBox ? mainBox.limit : 5000;

        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>✏️</span>
            <span>Editar Salário / Renda Mensal</span>
          </h3>
          <p class="text-[11px] text-slate-500 leading-relaxed">
            Digite sua renda mensal líquida. Ao salvar, a verba total e a sobra serão recalculadas.
          </p>
          <label class="text-xs font-bold text-slate-500 block mt-2">Valor da Renda Mensal (R$):</label>
          <input
            type="number"
            step="50"
            id="m-salario-val"
            value="${currentVal}"
            class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 focus:outline-none"
          />
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveSalario()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Salvar Renda</button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveSalario = function() {
        const val = parseFloat(document.getElementById('m-salario-val').value);
        if (isNaN(val) || val < 0) return alert('Informe um valor válido.');

        let mainBox = state.data.boxes.find(b => b.isMain) || state.data.boxes[0];
        if (mainBox) mainBox.limit = val;

        const existingRec = state.data.transactions.find(t => t.type === 'receita' && t.year === state.currentYear && t.month === state.currentMonth);
        if (existingRec) {
          existingRec.value = val;
        } else {
          state.data.transactions.unshift({
            id: Date.now(),
            desc: 'Salário Mensal',
            value: val,
            type: 'receita',
            boxId: mainBox ? mainBox.id : '1',
            category: 'Salário',
            payment: 'Pix',
            date: new Date().toISOString().slice(0, 10),
            year: state.currentYear,
            month: state.currentMonth
          });
        }

        saveData();
        closeModal();
        showToast('Renda atualizada para ' + formatMoeda(val) + '! 💰');
        render();
      };

      // MODAL: CRIAR / EDITAR CAIXINHA
      window.openModalNovaCaixinha = function() {
        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>📦</span>
            <span>Nova Caixinha de Verba</span>
          </h3>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Ícone / Emoji:</label>
            <input type="text" id="m-newbox-icon" value="📦" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Nome da Categoria:</label>
            <input type="text" id="m-newbox-name" placeholder="Ex: Pet, Cursos, Farmácia" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Limite Planejado (R$):</label>
            <input type="number" step="50" id="m-newbox-limit" placeholder="Ex: 500" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveNovaCaixinha()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Criar Caixinha</button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveNovaCaixinha = function() {
        const icon = document.getElementById('m-newbox-icon').value.trim() || '📦';
        const name = document.getElementById('m-newbox-name').value.trim();
        const limit = parseFloat(document.getElementById('m-newbox-limit').value);
        if (!name || isNaN(limit) || limit <= 0) return alert('Preencha os campos obrigatórios.');

        state.data.boxes.push({
          id: String(Date.now()),
          name,
          limit,
          color: '#6366f1',
          icon,
          isMain: false
        });
        saveData();
        closeModal();
        showToast('Nova caixinha criada!');
        render();
      };

      window.openModalEditarCaixinha = function(boxId) {
        const box = state.data.boxes.find(b => b.id === String(boxId));
        if (!box) return;

        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>✏️</span>
            <span>Editar Caixinha: ${box.name}</span>
          </h3>
          <div>
            <label class="text-xs font-bold text-slate-500 block">Emoji / Ícone:</label>

      window.saveNovaParcela = function() {
        const name = document.getElementById('m-parc-name').value.trim();
        const val = parseFloat(document.getElementById('m-parc-val').value);
        const currentP = parseInt(document.getElementById('m-parc-current').value, 10) || 1;
        const totalP = parseInt(document.getElementById('m-parc-total').value, 10) || 1;
        const cardId = document.getElementById('m-parc-card').value;
        if (!name || isNaN(val) || val <= 0) return alert('Informe dados válidos.');
        const remaining = Math.max(1, totalP - currentP + 1);

        for (let i = 0; i < remaining; i++) {
          const pNum = currentP + i;
          let lancMes = state.currentMonth + i;
          let lancAno = state.currentYear;
          while (lancMes > 12) {
            lancMes -= 12;
            lancAno++;
          }
          state.data.transactions.unshift({
            id: Date.now() + i,
            desc: name + ' (' + pNum + '/' + totalP + ')',
            value: val,
            type: 'despesa',
            boxId: '1',
            category: 'Compras Parceladas',
            payment: 'Cartão de Crédito',
            cardId,
            date: lancAno + '-' + String(lancMes).padStart(2, '0') + '-05',
            year: lancAno,
            month: lancMes
          });
        }

        saveData();
        closeModal();
        showToast('Compra parcelada adicionada! 💳');
        render();
      };

          bill.value = val;
          bill.dueDay = day;
          saveData();
          closeModal();
          showToast('Assinatura atualizada!');
          render();
        }

      window.saveEditarTrans = function(id) {
        const desc = document.getElementById('m-edit-trans-desc').value.trim();
        const val = parseFloat(document.getElementById('m-edit-trans-val').value);
        const date = document.getElementById('m-edit-trans-date').value;
        if (!desc || isNaN(val) || val <= 0) return alert('Informe dados válidos.');

        const t = state.data.transactions.find(item => item.id === id);
        if (t) {
          t.desc = desc;
          t.value = val;
          if (date) {
            t.date = date;
            const parts = date.split('-');
            t.year = parseInt(parts[0], 10);
            t.month = parseInt(parts[1], 10);
          }
          saveData();
          closeModal();
          showToast('Lançamento atualizado!');
          render();
        }
      };

      window.quickLancar = function (desc, val, cat) {
        state.data.transactions.unshift({
          id: Date.now(),
          desc,
          value: val,
          type: 'despesa',
          boxId: '1',
          category: cat,
          payment: 'Pix',
          date: new Date().toISOString().slice(0, 10),
          year: state.currentYear,
          month: state.currentMonth
        });
        saveData();
        showToast('Lançado: ' + desc + ' (' + formatMoeda(val) + ')! ⚡');
        render();
      };

      window.toggleCardLock = function (id) {
        const card = state.data.creditCards.find(c => c.id === id);
        if (card) {
          card.isBlocked = !card.isBlocked;
          saveData();
          showToast(card.isBlocked ? 'Cartão Bloqueado! 🔒' : 'Cartão Desbloqueado! 🔓');
          render();
        }
      };

      window.cycleCardSkin = function (id) {
        const skins = ['titanium', 'ultraviolet', 'emerald', 'gold', 'midnight'];
        const card = state.data.creditCards.find(c => c.id === id);
        if (card) {
          const idx = skins.indexOf(card.skin || 'titanium');
          card.skin = skins[(idx + 1) % skins.length];
          saveData();
          showToast('Skin alterada para ' + card.skin.toUpperCase() + '! 🎨');
          render();
        }
      };

      window.toggleCvv = function (id) {
        state.revealedCvv[id] = !state.revealedCvv[id];
        render();
      };

      window.deleteTrans = function (id) {
        if (confirm('Deseja excluir este lançamento?')) {
          state.data.transactions = state.data.transactions.filter(t => t.id !== id);
          saveData();
          showToast('Lançamento excluído!');
          render();
        }
      };

      window.alterarMeta = function (id, tipo) {
        const valStr = prompt(tipo === 'add' ? 'Valor para guardar na reserva (R$):' : 'Valor para resgatar da reserva (R$):');
        const val = parseFloat(valStr);
        if (isNaN(val) || val <= 0) return;

        const goal = state.data.savingsGoals.find(g => g.id === id);
        if (goal) {
          if (tipo === 'resgatar' && val > goal.currentValue) {
            alert('Valor de resgate excede o saldo acumulado!');
            return;
          }
          goal.currentValue = tipo === 'add' ? goal.currentValue + val : goal.currentValue - val;
          saveData();
          showToast(tipo === 'add' ? 'Guardado ' + formatMoeda(val) + '! 🐖' : 'Resgatado ' + formatMoeda(val) + '! 💸');
          render();
        }
      };

      window.shareWhatsApp = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        const rec = monthTrans.filter(t => t.type === 'receita').reduce((a, b) => a + (b.value || 0), 0);
        const desp = monthTrans.filter(t => t.type === 'despesa').reduce((a, b) => a + (b.value || 0), 0);
        const cartao = monthTrans.filter(t => t.type === 'despesa' && t.payment === 'Cartão de Crédito').reduce((a, b) => a + (b.value || 0), 0);
        const sobra = rec - desp;

        const lines = [
          '📊 *Resumo Financeiro - ' + MONTHS[state.currentMonth - 1] + ' / ' + state.currentYear + '*',
          '━━━━━━━━━━━━━━━━━━━━━━━━━',
          '💰 *Receitas:* ' + formatMoeda(rec),
          '📉 *Despesas:* ' + formatMoeda(desp),
          '💳 *No Cartão:* ' + formatMoeda(cartao),
          '🟢 *Sobra Líquida:* ' + formatMoeda(sobra),
          '━━━━━━━━━━━━━━━━━━━━━━━━━',
          '📑 *Lançamentos (' + monthTrans.length + '):*',
          ...monthTrans.slice(0, 10).map(t => '• ' + t.desc + ': ' + formatMoeda(t.value) + ' (' + t.payment + ')'),
          monthTrans.length > 10 ? '... e mais ' + (monthTrans.length - 10) + ' outros.' : '',

          'Gerado por Finanças Pro Mobile ✨'
        ].filter(Boolean);

        const text = lines.join('\n');
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          showToast('Resumo copiado para o WhatsApp! 📲');
        } else {
          alert('Resumo:\n\n' + text);
        }
      };

      window.exportCSV = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        if (monthTrans.length === 0) return alert('Nenhum lançamento no mês!');
        const rows = [
          ['Data', 'Descricao', 'Tipo', 'Categoria', 'Forma', 'Valor'],
          ...monthTrans.map(t => [t.date, t.desc, t.type, t.category, t.payment, t.value.toFixed(2)])
        ];
        const csvContent = '\uFEFF' + rows.map(e => e.join(';')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'extrato_' + state.currentMonth + '_' + state.currentYear + '.csv';
        link.click();
        URL.revokeObjectURL(url);
        showToast('Planilha CSV baixada! 📊');
      };

      window.exportHtmlCompleto = function () {
        try {
          const fullHtml = document.documentElement.outerHTML;
          const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 300);
          showToast('Ficheiro index.html pronto para uso offline! 🚀');
        } catch (e) {
          alert('Erro ao descarregar HTML.');
        }
      };

          inputPagamento.addEventListener('change', () => {
            if (inputPagamento.value === 'Cartão de Crédito') {
              cardContainer.classList.remove('hidden');
            } else {
              cardContainer.classList.add('hidden');
            }
          });

          function updateSimulator() {
            const val = parseFloat(inputValor.value) || 0;
            const parcelas = parseInt(inputParcelas.value, 10) || 1;
            const desc = parseFloat(simDiscountInput.value) || 0;
            const cdi = parseFloat(simCdiInput.value) || 0;

            if (val > 0) {
              const economiaAvista = val * (desc / 100);
              const rendimentoCdi = val * ((cdi / 100) * (parcelas / 2));
              const valeAvista = economiaAvista >= rendimentoCdi;

              simVerdict.innerHTML = `
                <div>💡 Desconto à vista: <b>${formatMoeda(economiaAvista)}</b></div>
                <div>📈 Rende no CDI (${parcelas}x): <b>~${formatMoeda(rendimentoCdi)}</b></div>
                <div class="mt-1.5 p-1.5 rounded-lg text-center ${valeAvista ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-indigo-500/20 text-indigo-600 dark:text-indigo-400'}">
                  ${valeAvista ? '🏆 Recomendação: Pague À VISTA com desconto!' : '🏆 Recomendação: PARCELE sem juros e deixe no CDI!'}
                </div>
              `;
            } else {
              simVerdict.textContent = 'Informe o valor acima para comparar o desconto com o CDI.';
            }
          }

          btnToggleSim.addEventListener('click', () => {
            state.showSimulator = !state.showSimulator;
            simBox.classList.toggle('hidden', !state.showSimulator);
            simIndicator.textContent = state.showSimulator ? 'Fechar' : 'Calcular';
            if (state.showSimulator) updateSimulator();
          });

          inputValor.addEventListener('input', updateSimulator);
          inputParcelas.addEventListener('change', updateSimulator);
          simDiscountInput.addEventListener('input', updateSimulator);
          simCdiInput.addEventListener('input', updateSimulator);

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('input-desc').value.trim();
            const val = parseFloat(document.getElementById('input-valor').value);
            const parcelas = parseInt(document.getElementById('input-parcelas').value, 10) || 1;
            const boxId = document.getElementById('input-caixinha').value;
            const payment = document.getElementById('input-pagamento').value;
            const cardId = document.getElementById('input-cartao')?.value;

            if (!desc || isNaN(val) || val <= 0) {
              showToast('Informe a descrição e valor válidos!');
              return;
            }

            if (payment === 'Cartão de Crédito') {
              const cardObj = state.data.creditCards.find(c => c.id === cardId);
              if (cardObj && cardObj.isBlocked) {
                showToast('⚠️ O cartão "' + cardObj.name + '" está bloqueado!');
                return;
              }
            }

            const valorPorParcela = +(val / parcelas).toFixed(2);
            for (let i = 0; i < parcelas; i++) {
              let lancMes = state.currentMonth + i;
              let lancAno = state.currentYear;
              while (lancMes > 12) {
                lancMes -= 12;
                lancAno++;
              }
              state.data.transactions.unshift({
                id: Date.now() + i,
                desc: parcelas > 1 ? desc + ' (' + (i + 1) + '/' + parcelas + ')' : desc,
                value: valorPorParcela,
                type: state.newTransType,
                boxId,
                category: 'Geral',
                payment,
                cardId: payment === 'Cartão de Crédito' ? cardId : undefined,
                date: new Date().toISOString().slice(0, 10),
                year: lancAno,
                month: lancMes
              });
            }

            saveData();
            showToast(parcelas > 1 ? parcelas + ' parcelas cadastradas!' : 'Lançamento salvo!');
            render();
          });
        }
      }

      updateNavIndicator();
      render();
    })();
  </script>
</body>
</html>
