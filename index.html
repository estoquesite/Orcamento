<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finanças Pro Mobile</title>
  <meta name="description" content="Aplicativo de gestão financeira pessoal completo e 100% editável para celular." />
  <meta name="theme-color" content="#4f46e5" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- FRAME DO SMARTPHONE -->
  <div id="phone-frame" class="w-full max-w-[430px] min-h-screen md:min-h-[890px] md:h-[92vh] flex flex-col relative overflow-hidden bg-slate-100 dark:bg-slate-950 md:rounded-[42px] md:border-[7px] md:border-slate-800 shadow-2xl transition-colors duration-300 dark">
    
    <!-- 1. HEADER SUPERIOR -->
    <header class="pt-3 px-5 pb-2.5 flex justify-between items-center bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shrink-0 z-30">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black tracking-wider text-slate-800 dark:text-slate-100 uppercase">Finanças Pro</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="btn-privacy"
          type="button"
          class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform cursor-pointer"
          title="Ocultar / Mostrar Valores"
        >
          👁️
        </button>

        <button
          id="btn-theme"
          type="button"
          class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform cursor-pointer"
          title="Alternar Tema Claro / Escuro"
        >
          ☀️
        </button>
      </div>
    </header>

    <!-- 2. BARRA DE NAVEGAÇÃO NO TOPO -->
    <nav class="w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex justify-around items-center px-2 py-1.5 shrink-0 z-20 shadow-xs">
      <button data-tab="painel" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-indigo-600 dark:text-indigo-400 font-black">
        <span class="text-base leading-none">📊</span>
        <span class="text-[10px] mt-0.5">Painel</span>
      </button>
      <button data-tab="lancar" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">➕</span>
        <span class="text-[10px] mt-0.5">Lançar</span>
      </button>
      <button data-tab="cartoes" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">💳</span>
        <span class="text-[10px] mt-0.5">Cartões</span>
      </button>
      <button data-tab="meses" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">📅</span>
        <span class="text-[10px] mt-0.5">Meses</span>
      </button>
      <button data-tab="mais" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">⚙️</span>
        <span class="text-[10px] mt-0.5">Mais</span>
      </button>
    </nav>

    <!-- 3. NAVEGAÇÃO DE MÊS/ANO -->
    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs font-bold shrink-0">
      <button id="btn-prev-month" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer shadow-2xs">
        ◀
      </button>
      <div id="month-label" class="text-center font-extrabold text-slate-900 dark:text-slate-100">
        Iniciando...
      </div>
      <button id="btn-next-month" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer shadow-2xs">
        ▶
      </button>
    </div>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main id="view-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-12">
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="hidden absolute top-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-black px-4 py-2 rounded-full shadow-2xl border border-slate-700 dark:border-slate-300 pointer-events-none transition-all">
      Notificação
    </div>

    <!-- MODAL -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
      <div id="modal-box" class="w-full max-w-[380px] bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
      </div>
    </div>

  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'FINANCAS_PRO_HARMONIOUS_V33';
      const CURRENT_TAB_KEY = 'financas_pro_active_tab';
      const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

      const DEFAULT_DATA = {
        boxes: [
          { id: '1', name: 'Meu Salário', limit: 5000, color: '#10b981', icon: '💼', isMain: true },
          { id: '2', name: 'Glória', limit: 600, color: '#3b82f6', icon: '🪙', isMain: false },
          { id: '3', name: 'Pensão Sophia', limit: 1500, color: '#ec4899', icon: '👧', isMain: false }
        ],
        creditCards: [
          { id: 'card-1', name: 'Itaú Mastercard', limit: 4000, color: '#f97316', brand: 'Mastercard', skin: 'titanium', cvv: '849', isBlocked: false },
          { id: 'card-2', name: 'Bradesco Visa', limit: 3000, color: '#ef4444', brand: 'Visa', skin: 'ultraviolet', cvv: '312', isBlocked: false },
          { id: 'card-3', name: 'Amazon Bradesco', limit: 2500, color: '#0ea5e9', brand: 'Visa', skin: 'emerald', cvv: '159', isBlocked: false },
          { id: 'card-4', name: 'Samsung Itaú', limit: 3500, color: '#334155', brand: 'Visa Platinum', skin: 'midnight', cvv: '742', isBlocked: false }
        ],
        transactions: [],
        extraIncomes: [],
        savingsGoals: [
          { id: 1, name: 'Reserva de Emergência', targetValue: 10000, currentValue: 2500, color: '#10b981', icon: '🛡️' }
        ],
        recurringBills: [
          { id: '1', name: 'Netflix 4K', value: 55.90, dueDay: 12, icon: '🍿' },
          { id: '2', name: 'Internet Fibra', value: 129.90, dueDay: 10, icon: '🌐' }
        ]
      };

      function loadData() {
        const chaves = [
          STORAGE_KEY,
          'FINANCAS_PRO_DATA_AUTONOMO',
          'financas_pro_v32_modern_panel',
          'financas_pro_v31_extra_income',
          'financas_pro_v30_clean_real'
        ];

        for (const k of chaves) {
          try {
            const raw = localStorage.getItem(k);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && typeof parsed === 'object') {
                return {
                  boxes: Array.isArray(parsed.boxes) && parsed.boxes.length > 0 ? parsed.boxes : (Array.isArray(parsed.budgetBoxes) && parsed.budgetBoxes.length > 0 ? parsed.budgetBoxes.map(b => ({ ...b, limit: b.amount, icon: b.icon || '📦' })) : DEFAULT_DATA.boxes),
                  creditCards: Array.isArray(parsed.creditCards) && parsed.creditCards.length > 0 ? parsed.creditCards : DEFAULT_DATA.creditCards,
                  transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
                  extraIncomes: Array.isArray(parsed.extraIncomes) ? parsed.extraIncomes : [],
                  savingsGoals: Array.isArray(parsed.savingsGoals) ? parsed.savingsGoals : (Array.isArray(parsed.goals) ? parsed.goals.map(g => ({ ...g, targetValue: g.target, currentValue: g.current, icon: '🎯' })) : DEFAULT_DATA.savingsGoals),
                  recurringBills: Array.isArray(parsed.recurringBills) ? parsed.recurringBills : DEFAULT_DATA.recurringBills
                };
              }
            }
          } catch (e) {
            console.error('Erro de leitura:', e);
          }
        }
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      const state = {
        data: loadData(),
        currentYear: new Date().getFullYear(),
        currentMonth: new Date().getMonth() + 1,
        currentTab: localStorage.getItem(CURRENT_TAB_KEY) || 'painel',
        privacyMode: false,
        darkMode: true,
        revealedCvv: {},
        newTransType: 'despesa',
        selectedCardId: null
      };

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        } catch (e) {
          console.error(e);
        }
      }

      function formatMoeda(num) {
        if (state.privacyMode) return 'R$ ••••••';
        return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      let toastTimeout = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.remove('hidden');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.add('hidden');
        }, 3000);
      }

      const phoneFrame = document.getElementById('phone-frame');
      const viewContent = document.getElementById('view-content');
      const monthLabel = document.getElementById('month-label');
      const btnPrivacy = document.getElementById('btn-privacy');
      const btnTheme = document.getElementById('btn-theme');
      const btnPrevMonth = document.getElementById('btn-prev-month');
      const btnNextMonth = document.getElementById('btn-next-month');
      const tabButtons = document.querySelectorAll('.tab-btn');
      const modalContainer = document.getElementById('modal-container');
      const modalBox = document.getElementById('modal-box');

      btnPrivacy.addEventListener('click', () => {
        state.privacyMode = !state.privacyMode;
        btnPrivacy.textContent = state.privacyMode ? '🙈' : '👁️';
        render();
      });

      btnTheme.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        if (state.darkMode) {
          phoneFrame.classList.add('dark');
          btnTheme.textContent = '☀️';
        } else {
          phoneFrame.classList.remove('dark');
          btnTheme.textContent = '🌙';
        }
      });

      btnPrevMonth.addEventListener('click', () => {
        if (state.currentMonth === 1) {
          state.currentMonth = 12;
          state.currentYear--;
        } else {
          state.currentMonth--;
        }
        render();
      });

      btnNextMonth.addEventListener('click', () => {
        if (state.currentMonth === 12) {
          state.currentMonth = 1;
          state.currentYear++;
        } else {
          state.currentMonth++;
        }
        render();
      });

      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentTab = btn.getAttribute('data-tab');
          localStorage.setItem(CURRENT_TAB_KEY, state.currentTab);
          updateNavButtons();
          render();
        });
      });

      function updateNavButtons() {
        tabButtons.forEach(b => {
          const isCur = b.getAttribute('data-tab') === state.currentTab;
          b.className = 'tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer ' +
            (isCur ? 'text-indigo-600 dark:text-indigo-400 font-black' : 'text-slate-400 font-bold');
        });
      }

      window.closeModal = function() {
        modalContainer.classList.add('hidden');
        modalBox.innerHTML = '';
      };

      modalContainer.addEventListener('click', (e) => {
        if (e.target === modalContainer) closeModal();
      });

      // MODAIS DE CAIXINHA
      window.openModalEditarCaixinha = function(boxId) {
        const box = state.data.boxes.find(b => String(b.id) === String(boxId));
        if (!box) return;

        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>✏️</span>
            <span>Editar Caixinha: ${box.name}</span>
          </h3>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block">Nome da Verba:</label>
            <input type="text" id="m-box-name" value="${box.name}" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block">Valor Mensal (R$):</label>
            <input type="number" step="50" id="m-box-limit" value="${box.limit || 0}" class="w-full mt-1 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block">Cor do Indicador:</label>
            <input type="color" id="m-box-color" value="${box.color || '#6366f1'}" class="w-full mt-1 h-9 rounded-xl bg-transparent border border-slate-200 dark:border-slate-700 cursor-pointer" />
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveEditarCaixinha('${box.id}')" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Salvar</button>
          </div>
          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <button onclick="deleteCaixinha('${box.id}')" class="w-full py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 text-xs font-bold border border-rose-500/30 cursor-pointer">
              🗑️ Excluir Caixinha
            </button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveEditarCaixinha = function(id) {
        const name = document.getElementById('m-box-name').value.trim();
        const limit = parseFloat(document.getElementById('m-box-limit').value);
        const color = document.getElementById('m-box-color').value;
        if (!name || isNaN(limit) || limit < 0) return alert('Informe dados válidos.');
        const box = state.data.boxes.find(b => String(b.id) === String(id));
        if (box) {
          box.name = name;
          box.limit = limit;
          box.color = color;
          saveData();
          closeModal();
          showToast('Caixinha atualizada!');
          render();
        }
      };

      window.deleteCaixinha = function(id) {
        if (confirm('Tem certeza que deseja excluir esta caixinha?')) {
          state.data.boxes = state.data.boxes.filter(b => String(b.id) !== String(id));
          saveData();
          closeModal();
          showToast('Caixinha excluída!');
          render();
        }
      };

      window.openModalNovaCaixinha = function() {
        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>📦</span>
            <span>Nova Caixinha de Verba</span>
          </h3>
          <input type="text" id="m-newbox-name" placeholder="Nome da Caixinha (Ex: Salário, Glória, Pensão)" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          <input type="number" step="50" id="m-newbox-limit" placeholder="Valor Mensal R$" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          <div>
            <label class="text-[11px] font-bold text-slate-500 block">Cor do Indicador:</label>
            <input type="color" id="m-newbox-color" value="#3b82f6" class="w-full mt-1 h-9 rounded-xl bg-transparent border border-slate-200 dark:border-slate-700 cursor-pointer" />
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveNovaCaixinha()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Criar Caixinha</button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveNovaCaixinha = function() {
        const name = document.getElementById('m-newbox-name').value.trim();
        const limit = parseFloat(document.getElementById('m-newbox-limit').value);
        const color = document.getElementById('m-newbox-color').value;
        if (!name || isNaN(limit) || limit <= 0) return alert('Preencha os campos corretamente.');
        state.data.boxes.push({
          id: String(Date.now()),
          name,
          limit,
          color: color || '#6366f1',
          icon: '📦',
          isMain: state.data.boxes.length === 0
        });
        saveData();
        closeModal();
        showToast('Nova caixinha criada!');
        render();
      };

      // VERBAS EXTRAS DO MÊS
      window.openModalNovaVerbaExtra = function() {
        modalBox.innerHTML = `
          <h3 class="text-xs font-black uppercase tracking-wide text-slate-900 dark:text-slate-100 flex items-center gap-1.5">
            <span>💵</span>
            <span>Adicionar Verba Extra no Mês</span>
          </h3>
          <p class="text-[11px] text-slate-500 leading-relaxed">
            Entradas avulsas deste mês (13º, bônus, vendas ou rendas extras) para somar à verba disponível.
          </p>
          <input type="text" id="m-extra-desc" placeholder="Descrição (Ex: 13º Salário, Venda celular)" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          <input type="number" step="50" id="m-extra-val" placeholder="Valor R$" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          <input type="date" id="m-extra-date" value="${new Date().toISOString().slice(0, 10)}" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold border border-slate-200 dark:border-slate-700" />
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold cursor-pointer">Cancelar</button>
            <button onclick="saveNovaVerbaExtra()" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold cursor-pointer">Adicionar</button>
          </div>
        `;
        modalContainer.classList.remove('hidden');
      };

      window.saveNovaVerbaExtra = function() {
        const desc = document.getElementById('m-extra-desc').value.trim();
        const val = parseFloat(document.getElementById('m-extra-val').value);
        const date = document.getElementById('m-extra-date').value;
        if (!desc || isNaN(val) || val <= 0) return alert('Informe descrição e valor válidos.');

        if (!state.data.extraIncomes) state.data.extraIncomes = [];
        state.data.extraIncomes.push({
          id: Date.now(),
          desc,
          value: val,
          date,
          year: state.currentYear,
          month: state.currentMonth
        });

        saveData();
        closeModal();
        showToast('Verba extra adicionada!');
        render();
      };

      window.removerVerbaExtra = function(id) {
        if (confirm('Remover esta verba extra?')) {
          state.data.extraIncomes = (state.data.extraIncomes || []).filter(e => e.id !== id);
          saveData();
          showToast('Verba extra removida!');
          render();
        }
      };

      window.lancarDiretoNaCaixinha = function(boxId) {
        state.currentTab = 'lancar';
        updateNavButtons();
        render();
        setTimeout(() => {
          const sel = document.getElementById('input-caixinha');
          if (sel) sel.value = String(boxId);
        }, 100);
      };

      // BACKUP
      window.copyBackup = function () {
        const json = JSON.stringify(state.data, null, 2);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(json);
          showToast('Backup copiado para o WhatsApp! 📋');
        } else {
          prompt('Copie seu código de backup abaixo:', json);
        }
      };

      window.restoreBackup = function () {
        const text = prompt('Cole aqui o texto do backup:');
        if (text) {
          try {
            const parsed = JSON.parse(text);
            if (parsed && typeof parsed === 'object') {
              state.data = parsed;
              saveData();
              showToast('Backup restaurado! 🎉');
              render();
            }
          } catch {
            alert('Texto de backup inválido.');
          }
        }
      };

      window.deleteTrans = function (id) {
        if (confirm('Deseja excluir este lançamento?')) {
          state.data.transactions = state.data.transactions.filter(t => t.id !== id);
          saveData();
          showToast('Lançamento excluído!');
          render();
        }
      };

      function render() {
        monthLabel.textContent = MONTHS[state.currentMonth - 1] + ' de ' + state.currentYear;

        const transactions = Array.isArray(state.data.transactions) ? state.data.transactions : [];
        const monthTrans = transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        const extraIncomes = Array.isArray(state.data.extraIncomes) ? state.data.extraIncomes : [];
        const monthExtras = extraIncomes.filter(e => e.year === state.currentYear && e.month === state.currentMonth);
        const totalExtras = monthExtras.reduce((a, b) => a + (Number(b.value) || 0), 0);

        const boxes = Array.isArray(state.data.boxes) ? state.data.boxes : [];

            btnDesp.addEventListener('click', () => {
              state.newTransType = 'despesa';
              btnDesp.className = 'py-2 rounded-xl text-xs font-black bg-rose-500 text-white shadow-md transition-all cursor-pointer';
              btnRec.className = 'py-2 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer';
            });
            btnRec.addEventListener('click', () => {
              state.newTransType = 'receita';
              btnRec.className = 'py-2 rounded-xl text-xs font-black bg-emerald-500 text-white shadow-md transition-all cursor-pointer';
              btnDesp.className = 'py-2 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer';
            });
          }

          if (inputPagamento && cardContainer) {
            inputPagamento.addEventListener('change', () => {
              cardContainer.style.display = inputPagamento.value === 'Cartão de Crédito' ? 'block' : 'none';
            });
          }

          if (form) {
            form.addEventListener('submit', (e) => {
              e.preventDefault();
              const desc = document.getElementById('input-desc').value.trim();
              const val = parseFloat(document.getElementById('input-valor').value);
              const parcelas = parseInt(document.getElementById('input-parcelas').value, 10) || 1;
              const boxId = document.getElementById('input-caixinha').value;
              const payment = document.getElementById('input-pagamento').value;
              const cardId = document.getElementById('input-cartao')?.value;

              if (!desc || isNaN(val) || val <= 0) return alert('Informe descrição e valor válidos!');

              const valorPorParcela = +(val / parcelas).toFixed(2);
              for (let i = 0; i < parcelas; i++) {
                let lancMes = state.currentMonth + i;
                let lancAno = state.currentYear;
                while (lancMes > 12) {
                  lancMes -= 12;
                  lancAno++;
                }
                state.data.transactions.unshift({
                  id: Date.now() + i,
                  desc: parcelas > 1 ? `${desc} (${i + 1}/${parcelas})` : desc,
                  value: valorPorParcela,
                  type: state.newTransType,
                  boxId,
                  category: 'Geral',
                  payment,
                  cardId: payment === 'Cartão de Crédito' ? cardId : undefined,
                  date: new Date().toISOString().slice(0, 10),
                  year: lancAno,
                  month: lancMes
                });
              }

              saveData();
              showToast('Lançamento salvo com sucesso!');
              render();
            });
          }
        }
      }

      window.goToMonth = function (m) {
        state.currentMonth = m;
        state.currentTab = 'painel';
        localStorage.setItem(CURRENT_TAB_KEY, 'painel');
        updateNavButtons();
        render();
      };

      updateNavButtons();
      render();
    })();
  </script>
</body>
</html>
