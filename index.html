<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finanças Pro Mobile</title>
  <meta name="description" content="Aplicativo inteligente de controle financeiro pessoal 100% editável para celular e computador." />
  <meta name="theme-color" content="#6366f1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            }
          }
        }
      };
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .modal-backdrop {
      backdrop-filter: blur(6px);
    }

    /* ============================================================ */
    /* SISTEMA DE TEMAS: DIA (CLARO - PADRÃO) & NOITE (ESCURO)     */
    /* ============================================================ */

    /* MODO DIA (PADRÃO - quando html NÃO tem a classe .dark) */
  root {
      --bg-body: #f1f5f9;       /* Cor de fundo principal da tela */
      --bg-card: #ffffff;       /* 👈 Linha 50: Cor de fundo de TODOS os quadros/cards */
      --bg-subtle: #f8fafc;     /* Cor de fundo secundária (pequenos blocos) */
      --color-border: #e2e8f0;  /* Cor das bordas e linhas separadoras */
      --text-main: #0f172a;     /* 👈 Linha 54: Cor principal da fonte/texto */
      --text-secondary: #1e293b;/* Cor secundária do texto */
      --text-muted: #64748b;    /* Cor dos textos mais apagados/cinzas */
    }
    html:not(.dark) header {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) header span.text-slate-100 {
      color: #0f172a !important;
    }
    html:not(.dark) #month-nav {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) #month-label {
      color: #0f172a !important;
    }
    html:not(.dark) nav,
    html:not(.dark) #bottom-nav {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-950 {
      background-color: #f8fafc !important;
    }
    html:not(.dark) .bg-slate-900,
    html:not(.dark) .bg-slate-900/90,
    html:not(.dark) .bg-slate-900/95 {
      background-color: #ffffff !important;
    }
    html:not(.dark) .bg-slate-800 {
      background-color: #f1f5f9 !important;
    }
    html:not(.dark) .bg-slate-800/50,
    html:not(.dark) .bg-slate-800/80 {
      background-color: #f8fafc !important;
    }
    html:not(.dark) .bg-slate-700 {
      background-color: #e2e8f0 !important;
    }
    html:not(.dark) .border-slate-800,
    html:not(.dark) .border-slate-700,
    html:not(.dark) .border-slate-700/50,
    html:not(.dark) .border-slate-700/60 {
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .text-slate-100 {
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-200 {
      color: #1e293b !important;
    }
    html:not(.dark) .text-slate-300 {
      color: #334155 !important;
    }
    html:not(.dark) .text-slate-400 {
      color: #64748b !important;
    }
    html:not(.dark) input,
    html:not(.dark) select,
    html:not(.dark) textarea {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    html:not(.dark) input:focus,
    html:not(.dark) select:focus,
    html:not(.dark) textarea:focus {
      background-color: #ffffff !important;
      border-color: #6366f1 !important;
    }
    html:not(.dark) .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.5) !important;
    }
    html:not(.dark) #modal-box {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      color: #0f172a !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
    }
    html:not(.dark) .tab-btn.text-slate-400 {
      color: #64748b !important;
    }
    html:not(.dark) .tab-btn.text-indigo-400 {
      color: #4f46e5 !important;
    }
    html:not(.dark) #toast {
      background-color: #0f172a !important;
      color: #ffffff !important;
      border-color: #334155 !important;
    }

    /* MODO NOITE (COM CLASSE .dark NO HTML) */
    html.dark body {
      background-color: #090d16;
      color: #f8fafc;
    }
    html.dark #phone-frame {
      background-color: #0f172a;
      border-color: #1e293b;
    }
    html.dark .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.85);
    }

    /* MODO COMPUTADOR (RESPONSIVO E EXPANDIDO) */
    #phone-frame.desktop-mode {
      max-width: 1040px !important;
      border-radius: 28px !important;
      border-width: 2px !important;
    }
    #phone-frame.desktop-mode #bottom-nav {
      max-width: 1040px !important;
      border-radius: 0 0 28px 28px !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- FRAME DO SMARTPHONE / COMPUTADOR -->
  <div id="phone-frame" class="w-full max-w-[430px] min-h-screen md:min-h-[890px] md:h-[94vh] flex flex-col relative overflow-hidden bg-slate-900 md:rounded-[42px] md:border-[7px] md:border-slate-800 shadow-2xl transition-all duration-300">

      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>

          📱 Celular
        </span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- BOTÃO MODO COMPUTADOR / CELULAR -->
        <button
          id="btn-screen-mode"
          type="button"
          class="p-1.5 px-2 rounded-xl bg-slate-800 text-slate-200 hover:scale-105 transition-all cursor-pointer flex items-center gap-1 border border-slate-700/60 shadow-xs"
          title="Alternar entre Visualização Computador e Celular"

          <span id="screen-icon" class="text-sm">💻</span>
          <span id="screen-text" class="text-[10px] font-bold hidden sm:inline">PC</span>
        </button>

        <button
          id="btn-privacy"
          type="button"
          class="p-1.5 rounded-xl bg-slate-800 text-slate-300 hover:scale-105 transition-transform cursor-pointer border border-slate-700/60"
          title="Ocultar / Mostrar Valores"
        >
          👁️
        </button>

        <button
          id="btn-theme"
          type="button"
          class="p-1.5 rounded-xl bg-slate-800 text-slate-300 hover:scale-105 transition-transform cursor-pointer border border-slate-700/60"
          title="Alternar Modo Dia / Noite"
        >
          🌙
        </button>
      </div>
    </header>

    <!-- NAVEGAÇÃO DE MÊS/ANO -->
    <div id="month-nav" class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex justify-between items-center text-xs font-bold shrink-0">
      <button id="btn-prev-month" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 cursor-pointer active:scale-95">
        ◀
      </button>
      <div id="month-label" class="text-center font-extrabold text-slate-100">
        Carregando...
      </div>
      <button id="btn-next-month" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-200 hover:bg-slate-700 cursor-pointer active:scale-95">
        ▶
      </button>
    </div>

    <!-- VIEWPORT COM PADDING-BOTTOM PARA NÃO TAPAR BOTÕES -->
    <main id="view-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-28">
      <!-- Injetado dinamicamente -->
    </main>

    <!-- BARRA INFERIOR DE ABAS FIXA NO FUNDO -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center px-2 py-1.5 z-50 shadow-2xl pb-[max(env(safe-area-inset-bottom),0.5rem)]">
      <button data-tab="painel" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-indigo-400 font-black">
        <span class="text-lg leading-none">📊</span>
        <span class="text-[10px] mt-0.5">Painel</span>
      </button>
      <button data-tab="lancar" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">➕</span>
        <span class="text-[10px] mt-0.5">Lançar</span>
      </button>
      <button data-tab="cartoes" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">💳</span>
        <span class="text-[10px] mt-0.5">Cartões</span>
      </button>
      <button data-tab="meses" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">📅</span>
        <span class="text-[10px] mt-0.5">Meses</span>
      </button>
      <button data-tab="mais" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-lg leading-none">⚙️</span>
        <span class="text-[10px] mt-0.5">Mais</span>
      </button>
    </nav>

    <!-- NOTIFICAÇÃO TOAST FLUTUANTE -->
    <div id="toast" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-black px-4 py-2 rounded-full shadow-2xl border border-slate-700 pointer-events-none transition-all">
      Notificação
    </div>

    <!-- MODAL CONTAINER DINÂMICO -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
      <div id="modal-box" class="w-full max-w-[380px] bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto text-slate-100">
        <!-- Injetado por JS -->
      </div>
    </div>

  </div>

            date: String(t.date || new Date().toISOString().slice(0, 10)),
            year: Number(t.year) || (parts[0] ? Number(parts[0]) : new Date().getFullYear()),
            month: Number(t.month) || (parts[1] ? Number(parts[1]) : new Date().getMonth() + 1)
          };
        });

        const rawGoals = Array.isArray(loaded.savingsGoals) ? loaded.savingsGoals : defaultGoals;
        const savingsGoals = rawGoals.map(function (g, i) {
          return {
            id: g.id || (i + 1),
            name: String(g.name || 'Meta ' + (i + 1)),
            targetValue: Number(g.targetValue || g.target || 5000),
            currentValue: Number(g.currentValue || g.current || 0),
            color: g.color || '#10b981',
            icon: g.icon || '🎯'
          };
        });

        const rawBills = Array.isArray(loaded.recurringBills) ? loaded.recurringBills : defaultBills;
        const recurringBills = rawBills.map(function (b, i) {
          return {
            id: String(b.id || (i + 1)),
            name: String(b.name || 'Conta ' + (i + 1)),
            value: Number(b.value || b.amount || 0),
            dueDay: Number(b.dueDay || 10),
            icon: b.icon || '🔄'
          };
        });

        const monthIncomes = (loaded.monthIncomes && typeof loaded.monthIncomes === 'object') ? loaded.monthIncomes : {};

        return {
          boxes,
          creditCards,
          transactions,
          savingsGoals,
          recurringBills,
          monthIncomes
        };

      function updateScreenMode(mode) {

          localStorage.setItem('financas_pro_screen_mode', mode);

        const nav = document.getElementById('bottom-nav');
        const icon = document.getElementById('screen-icon');
        const text = document.getElementById('screen-text');
        const badge = document.getElementById('screen-badge');

        if (mode === 'desktop') {
          if (frame) {
            frame.classList.add('desktop-mode');
            frame.classList.remove('max-w-[430px]', 'md:rounded-[42px]', 'md:border-[7px]');
            frame.classList.add('max-w-5xl', 'md:rounded-3xl', 'md:border-2');

            nav.classList.remove('max-w-[430px]');
            nav.classList.add('max-w-5xl');
          }
          if (icon) icon.textContent = '📱';
          if (text) text.textContent = 'Celular';
          if (badge) badge.textContent = '💻 Computador';
        } else {
          if (frame) {

            frame.classList.remove('max-w-5xl', 'md:rounded-3xl', 'md:border-2');

      window.saveSalario = function() {

        if (existingRec) {
          existingRec.value = val;
        } else {
          state.data.transactions.unshift({
            id: Date.now(),
            desc: 'Salário Mensal',
            value: val,
            type: 'receita',
            boxId: mainBox ? mainBox.id : '1',

            payment: 'Pix',

            year: state.currentYear,

      window.saveNovaParcela = function() {
        const name = document.getElementById('m-parc-name').value.trim();

        const currentP = parseInt(document.getElementById('m-parc-current').value, 10) || 1;

            date: lancAno + '-' + String(lancMes).padStart(2, '0') + '-05',

            month: lancMes

      window.saveEditarTransacao = function (id) {
        const t = (state.data.transactions || []).find(item => item.id == id);
        if (!t) return;

        const desc = document.getElementById('m-trans-desc').value.trim();
        const val = parseFloat(document.getElementById('m-trans-val').value);
        const type = document.getElementById('m-trans-type').value;
        const boxId = document.getElementById('m-trans-box').value;
        const payment = document.getElementById('m-trans-pay').value;
        const cardId = document.getElementById('m-trans-card').value || undefined;
        const date = document.getElementById('m-trans-date').value;

        if (!desc || isNaN(val) || val <= 0) {
          alert('Preencha a descrição e um valor positivo.');
          return;
        }

        const parts = String(date || '').split('-');
        t.desc = desc;
        t.value = val;
        t.type = type;
        t.boxId = boxId;
        t.payment = payment;
        t.cardId = payment === 'Cartão de Crédito' ? cardId : undefined;
        t.date = date;
        if (parts[0]) t.year = Number(parts[0]);
        if (parts[1]) t.month = Number(parts[1]);

        saveData();
        closeModal();
        showToast('Lançamento atualizado!');
        render();
      };

      window.deleteTrans = function (id) {
        if (confirm('Deseja excluir este lançamento?')) {

        const desp = monthTrans.filter(t => t.type === 'despesa').reduce((a, b) => a + (b.value || 0), 0);
        const cartao = monthTrans.filter(t => t.type === 'despesa' && t.payment === 'Cartão de Crédito').reduce((a, b) => a + (b.value || 0), 0);
        const sobra = rec - desp;

        const lines = [
          '📊 *Resumo Financeiro - ' + MONTHS[state.currentMonth - 1] + ' / ' + state.currentYear + '*',
          '━━━━━━━━━━━━━━━━━━━━━━━━━',

          '━━━━━━━━━━━━━━━━━━━━━━━━━',
          '📑 *Lançamentos (' + monthTrans.length + '):*',
          ...monthTrans.slice(0, 10).map(t => '• ' + t.desc + ': ' + formatMoeda(t.value) + ' (' + t.payment + ')'),
          monthTrans.length > 10 ? '... e mais ' + (monthTrans.length - 10) + ' outros.' : '',
          '━━━━━━━━━━━━━━━━━━━━━━━━━',
          'Gerado por Finanças Pro Mobile ✨'
        ].filter(Boolean);

        const text = lines.join('\n');
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          showToast('Resumo copiado para o WhatsApp! 📲');

      window.exportCSV = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        if (monthTrans.length === 0) return alert('Nenhum lançamento no mês!');
        const rows = [
          ['Data', 'Descricao', 'Tipo', 'Categoria', 'Forma', 'Valor'],
          ...monthTrans.map(t => [t.date, t.desc, t.type, t.category, t.payment, t.value.toFixed(2)])
        ];
        const csvContent = '\uFEFF' + rows.map(e => e.join(';')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'extrato_' + state.currentMonth + '_' + state.currentYear + '.csv';
        link.click();
        URL.revokeObjectURL(url);
        showToast('Planilha CSV baixada! 📊');
      };

      window.exportHtmlCompleto = function () {
        try {
          const fullHtml = document.documentElement.outerHTML;
          const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 300);
          showToast('Ficheiro index.html descarregado no celular! 🚀');
        } catch (e) {
          alert('Erro ao descarregar HTML.');
        }
      };

                  </div>

                  const cardObj = (state.data.creditCards || []).find(c => c.id === cardId);
                  if (cardObj && cardObj.isBlocked) {
                    showToast('⚠️ O cartão "' + cardObj.name + '" está bloqueado!');
                    return;
                  }
                }

                const valorPorParcela = +(val / parcelas).toFixed(2);
                for (let i = 0; i < parcelas; i++) {
                  let lancMes = state.currentMonth + i;
                  let lancAno = state.currentYear;
                  while (lancMes > 12) {
                    lancMes -= 12;
                    lancAno++;
                  }
                  state.data.transactions.unshift({
                    id: Date.now() + i,
                    desc: parcelas > 1 ? desc + ' (' + (i + 1) + '/' + parcelas + ')' : desc,
                    value: valorPorParcela,
                    type: state.newTransType,
                    boxId,
                    category: 'Geral',
                    payment,
                    cardId: payment === 'Cartão de Crédito' ? cardId : undefined,
                    date: new Date().toISOString().slice(0, 10),
                    year: lancAno,
                    month: lancMes
                  });
                }

                saveData();
                showToast(parcelas > 1 ? parcelas + ' parcelas cadastradas!' : 'Lançamento salvo!');
                render();
              });
            }
          }
        } catch (err) {
          console.error('Erro na renderização:', err);
          if (viewContent) {
            viewContent.innerHTML = `
              <div class="p-6 text-center space-y-4 bg-slate-900 border border-slate-800 rounded-3xl mt-8 text-white">
                <div class="text-4xl">⚠️</div>
                <h3 class="text-base font-black text-amber-400">Recuperação Automática</h3>
                <p class="text-xs text-slate-400 leading-relaxed">
                  O navegador detectou dados antigos incompatíveis. Clique abaixo para reiniciar com segurança.
                </p>
                <button onclick="resetData()" class="w-full py-3 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs cursor-pointer shadow-lg active:scale-95">
                  🔄 Restaurar Dados de Fábrica
                </button>
              </div>
            `;
          }
        }
      }

      render();
    })();
  </script>
</body>
</html>
