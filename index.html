<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro - Controle Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card-glass {
            background: linear-gradient(135deg, rgba(22, 27, 34, 0.9), rgba(13, 17, 23, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-holographic-1 {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
        }
        .card-holographic-2 {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }
        .card-holographic-3 {
            background: linear-gradient(135deg, #0b486b, #f56217);
        }
    </style>
</head>
<body class="pb-20">

    <!-- Top Bar -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800 bg-[#0d1117]/80 sticky top-0 z-50 backdrop-blur">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full inline-block"></span>
            <h1 class="font-bold tracking-wide text-sm">FINANÇAS PRO</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button class="p-2 rounded-lg bg-gray-800 text-xs">💻</button>
            <button class="p-2 rounded-lg bg-gray-800 text-xs">👁️</button>
            <button class="p-2 rounded-lg bg-gray-800 text-xs">☀️</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Mês Atual Header -->
        <div class="flex justify-between items-center bg-gray-900/50 p-2 rounded-xl border border-gray-800">
            <button class="text-gray-400 px-2">&lt;</button>
            <span class="font-medium text-sm">Setembro de 2026</span>
            <button class="text-gray-400 px-2">&gt;</button>
        </div>

        <!-- Painel Resumo -->
        <div class="grid grid-cols-2 gap-3">
            <div class="card-glass p-4 rounded-2xl relative">
                <span class="text-xs text-indigo-400 font-semibold tracking-wider">VERBA / RECEITAS</span>
                <p class="text-xl font-bold mt-2">R$ 0,00</p>
                <span class="absolute top-3 right-3 text-xs bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">✏️</span>
            </div>
            <div class="card-glass p-4 rounded-2xl bg-gradient-to-br from-rose-950/40 to-gray-900">
                <span class="text-xs text-rose-400 font-semibold tracking-wider">TOTAL GASTO</span>
                <p class="text-xl font-bold mt-2 text-rose-400">R$ 1.324,40</p>
            </div>
            <div class="card-glass p-4 rounded-2xl bg-gradient-to-br from-purple-950/40 to-gray-900">
                <span class="text-xs text-purple-400 font-semibold tracking-wider">FATURA CARTÕES</span>
                <p class="text-xl font-bold mt-2">R$ 944,40</p>
            </div>
            <div class="card-glass p-4 rounded-2xl bg-gradient-to-br from-emerald-950/40 to-gray-900">
                <span class="text-xs text-emerald-400 font-semibold tracking-wider">SOBRA LÍQUIDA</span>
                <p class="text-xl font-bold mt-2 text-emerald-400">-R$ 1.324,40</p>
            </div>
        </div>

        <!-- Atalhos Rápidos -->
        <div class="flex space-x-2 overflow-x-auto pb-2 text-xs">
            <span class="bg-gray-800 px-3 py-1.5 rounded-full whitespace-nowrap border border-gray-700">🛒 Mercado R$ 80</span>
            <span class="bg-gray-800 px-3 py-1.5 rounded-full whitespace-nowrap border border-gray-700">⛽ Posto R$ 100</span>
            <span class="bg-gray-800 px-3 py-1.5 rounded-full whitespace-nowrap border border-gray-700">🍕 Lanche R$ 45</span>
        </div>

        <!-- Seção de Caixinhas / Metas -->
        <div class="card-glass p-4 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold flex items-center gap-2">📦 CAIXINHAS DE VERBA</h2>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-xl font-medium">+ Nova Caixinha</button>
            </div>
            
            <div class="space-y-3">
                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800/80">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="font-medium">Meu Salário <span class="bg-indigo-950 text-indigo-300 text-[10px] px-1 rounded ml-1">Principal</span></span>
                        <span>R$ 799,40 / R$ 5.000,00</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                        <div class="bg-emerald-500 h-full w-[16%]"></div>
                    </div>
                </div>

                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800/80">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="font-medium">Glória</span>
                        <span>R$ 145,00 / R$ 600,00</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                        <div class="bg-blue-500 h-full w-[24%]"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Estilo App Nativo) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0d1117] border-t border-gray-800 flex justify-around py-3 text-xs text-gray-400">
        <button class="flex flex-col items-center text-indigo-400">
            <span class="text-lg">📊</span>
            <span>Painel</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span class="text-lg">➕</span>
            <span>Lançar</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span class="text-lg">💳</span>
            <span>Cartões</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span class="text-lg">📅</span>
            <span>Meses</span>
        </button>
        <button class="flex flex-col items-center hover:text-white">
            <span class="text-lg">⚙️</span>
            <span>Mais</span>
        </button>
    </nav>

</body>
</html>
