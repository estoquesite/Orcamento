<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finanças Pro Mobile</title>
  <meta name="description" content="Aplicativo de gestão financeira pessoal completo e 100% editável para celular." />
  <meta name="theme-color" content="#4f46e5" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body {
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 antialiased min-h-screen flex items-center justify-center p-0 md:p-4">

  <!-- FRAME DO SMARTPHONE -->
  <div id="phone-frame" class="w-full max-w-[430px] min-h-screen md:min-h-[890px] md:h-[92vh] flex flex-col relative overflow-hidden bg-slate-100 dark:bg-slate-950 md:rounded-[42px] md:border-[7px] md:border-slate-800 shadow-2xl transition-all duration-300">

    <!-- CAMADAS DE FUNDO PERSONALIZADO (COR SÓLIDA / FOTO EXTERNA) -->
    <div id="custom-bg-image" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-300 pointer-events-none" style="display: none;"></div>
    <div id="custom-bg-overlay" class="absolute inset-0 z-0 transition-all duration-300 pointer-events-none" style="display: none; background: rgba(255, 255, 255, 0.85);"></div>

    <!-- TELA DE BLOQUEIO DE SEGURANÇA (PIN / BIOMETRIA) -->
    <div id="tela-bloqueio-app" class="absolute inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center space-y-4 transition-all duration-300 hidden">
      <div class="w-16 h-16 rounded-3xl bg-amber-500/20 border-2 border-amber-500/40 text-amber-400 flex items-center justify-center text-3xl shadow-lg">
        🔒
      </div>
      <div>
        <h2 class="text-base font-black text-white uppercase tracking-wider">Finanças Pro</h2>
        <p class="text-xs text-slate-300 mt-1">Aplicativo Protegido por Senha PIN</p>
      </div>
      <div class="w-full max-w-[260px] space-y-2.5">
        <input
          type="password"
          id="input-pin-app"
          maxlength="6"
          inputmode="numeric"
          placeholder="Digite seu PIN (Padrão: 1234)"
          class="w-full py-3 px-4 bg-slate-800/90 border border-slate-700 rounded-2xl text-center text-white text-sm font-black tracking-widest outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition placeholder:text-slate-500 placeholder:text-xs"
          onkeypress="if(event.key==='Enter')desbloquearAppComPin()"
        />
        <button
          onclick="desbloquearAppComPin()"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-2xl transition shadow-md shadow-indigo-600/30 active:scale-95 cursor-pointer flex items-center justify-center gap-1.5"
        >
          <span>🔓</span>
          <span>Desbloquear App</span>
        </button>
        <button
          onclick="desbloquearAppComBiometria()"
          class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs rounded-2xl transition active:scale-95 cursor-pointer flex items-center justify-center gap-1.5"
        >
          <span>👆</span>
          <span>Entrar com Digital / FaceID</span>
        </button>
        <div id="erro-pin-app" class="text-rose-400 font-bold text-[11px] hidden pt-1">
          PIN Incorreto! (Padrão: 1234)
        </div>
      </div>
    </div>

    
    <!-- 1. HEADER SUPERIOR -->
    <header class="pt-3 px-5 pb-2.5 flex justify-between items-center bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shrink-0 z-30">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-xs font-black tracking-wider text-slate-800 dark:text-slate-100 uppercase">Finanças Pro</span>
        <span class="text-[9px] px-1.5 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400 font-bold border border-indigo-500/20">V40 Cloud</span>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="btn-privacy"
          type="button"
          class="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform cursor-pointer"
          title="Ocultar / Mostrar Valores"
        >
          👁️
        </button>

        <button
          id="btn-theme-palette"
          type="button"
          onclick="openModalTemas()"
          class="p-1.5 rounded-full bg-indigo-50 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-slate-700 hover:scale-105 transition-transform cursor-pointer"
          title="Personalizar Cores e Foto de Fundo"
        >
          🎨
        </button>

        <button
          id="btn-lock-screen"
          type="button"
          onclick="trancarApp()"
          class="p-1.5 rounded-full bg-amber-50 dark:bg-slate-800 text-amber-500 border border-amber-200 dark:border-slate-700 hover:scale-105 transition-transform cursor-pointer"
          title="Trancar Aplicativo (Bloqueio)"
        >
          🔒
        </button>
      </div>
    </header>

    <!-- 2. NAVEGAÇÃO SUPERIOR FIXA (Com Ícones e Rótulos) -->
    <nav class="w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex justify-around items-center px-1 py-1.5 shrink-0 z-20 shadow-xs">
      <button data-tab="painel" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-indigo-600 dark:text-indigo-400 font-black">
        <span class="text-base leading-none">📊</span>
        <span class="text-[10px] mt-0.5">Painel</span>
      </button>
      <button data-tab="lancar" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">➕</span>
        <span class="text-[10px] mt-0.5">Lançar</span>
      </button>
      <button data-tab="cartoes" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">💳</span>
        <span class="text-[10px] mt-0.5">Cartões</span>
      </button>
      <button data-tab="meses" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">📅</span>
        <span class="text-[10px] mt-0.5">Meses</span>
      </button>
      <button data-tab="mais" class="tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer text-slate-400 font-bold">
        <span class="text-base leading-none">⚙️</span>
        <span class="text-[10px] mt-0.5">Mais</span>
      </button>
    </nav>

    <!-- 3. SELETOR DE MÊS/ANO -->
    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center text-xs font-bold shrink-0">
      <button id="btn-prev-month" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer shadow-2xs active:scale-95">
        ◀
      </button>
      <div id="month-label" class="text-center font-extrabold text-slate-900 dark:text-slate-100">
        Carregando...
      </div>
      <button id="btn-next-month" class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer shadow-2xs active:scale-95">
        ▶
      </button>
    </div>

    <!-- VIEWPORT DE CONTEÚDO COM ROLAGEM LIVRE -->
    <main id="view-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-12">
      <!-- Injetado dinamicamente -->
    </main>

    <!-- TOAST FLUTUANTE -->
    <div id="toast" class="hidden absolute top-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-black px-4 py-2 rounded-full shadow-2xl border border-slate-700 dark:border-slate-300 pointer-events-none transition-all">
      Notificação
    </div>

    <!-- MODAL CONTAINER UNIVERSAL -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
      <div id="modal-box" class="w-full max-w-[390px] bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
        <!-- Injetado dinamicamente -->
      </div>
    </div>

  </div>

  <script>
    (function () {
      // Monitor global de erros para evitar tela em branco sob qualquer circunstância
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        console.error('Erro global capturado:', msg, error);
        const vc = document.getElementById('view-content');
        if (vc) {
          vc.innerHTML = `
            <div class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-center space-y-3">
              <div class="text-2xl">⚠️</div>
              <div class="text-xs font-black text-rose-600 dark:text-rose-400 uppercase">Recuperação Automática</div>
              <p class="text-[11px] text-slate-600 dark:text-slate-300">Foi detectada uma inconsistência nos dados em cache.</p>
              <button onclick="resetData()" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs shadow-md cursor-pointer active:scale-95">
                Restaurar Padrão Seguro
              </button>
            </div>
          `;
        }
        return false;
      };

      const STORAGE_KEY = 'FINANCAS_PRO_DATA_AUTONOMO';
      const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

      // Cores e Temas Oficiais dos Bancos e Cartões
      const BANK_THEMES = {
        itau: {
          name: 'Itaú (Laranja / Azul)',
          gradient: 'from-[#ff6200] via-[#e55300] to-[#002f6c]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-orange-400/30',
          badge: 'bg-orange-500/30 text-orange-100 border-orange-400/40'
        },
        bradesco: {
          name: 'Bradesco (Vermelho / Vinho)',
          gradient: 'from-[#cc092f] via-[#a80524] to-[#600114]',
          chipColor: '#d4af37',
          textColor: 'text-white',
          border: 'border-red-400/30',
          badge: 'bg-red-500/30 text-red-100 border-red-400/40'
        },
        amazon: {
          name: 'Amazon Prime (Grafite / Dourado)',
          gradient: 'from-[#131921] via-[#232f3e] to-[#0f1111]',
          chipColor: '#ff9900',
          textColor: 'text-white',
          border: 'border-amber-500/30',
          badge: 'bg-amber-500/20 text-amber-300 border-amber-400/40'
        },
        samsung: {
          name: 'Samsung Pay (Azul Royal Metálico)',
          gradient: 'from-[#1428a0] via-[#0c1b75] to-[#050a2b]',
          chipColor: '#ffffff',
          textColor: 'text-white',
          border: 'border-blue-400/30',
          badge: 'bg-blue-500/30 text-blue-100 border-blue-400/40'
        },
        nubank: {
          name: 'Nubank (Roxo Ultravioleta)',
          gradient: 'from-[#820ad1] via-[#5c0696] to-[#2c0148]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-purple-400/30',
          badge: 'bg-purple-500/30 text-purple-100 border-purple-400/40'
        },
        inter: {
          name: 'Banco Inter (Laranja Neon)',
          gradient: 'from-[#ff7a00] via-[#e56200] to-[#803300]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-orange-400/30',
          badge: 'bg-orange-500/30 text-orange-100 border-orange-400/40'
        },
        c6: {
          name: 'C6 Bank (Carbon Grafite)',
          gradient: 'from-[#2b2b2b] via-[#1c1c1c] to-[#080808]',
          chipColor: '#e0e0e0',
          textColor: 'text-white',
          border: 'border-zinc-500/30',
          badge: 'bg-zinc-700/50 text-zinc-100 border-zinc-500/40'
        },
        santander: {
          name: 'Santander (Vermelho Vivo)',
          gradient: 'from-[#ec0000] via-[#b80000] to-[#680000]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-red-400/30',
          badge: 'bg-red-500/30 text-red-100 border-red-400/40'
        },
        bb: {
          name: 'Banco do Brasil (Azul / Amarelo Ouro)',
          gradient: 'from-[#003882] via-[#002b66] to-[#d4af37]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-yellow-400/30',
          badge: 'bg-yellow-500/20 text-yellow-200 border-yellow-400/40'
        },
        caixa: {
          name: 'Caixa (Azul / Laranja)',
          gradient: 'from-[#005ca9] via-[#003d73] to-[#f37021]',
          chipColor: '#ffd700',
          textColor: 'text-white',
          border: 'border-blue-400/30',
          badge: 'bg-orange-500/20 text-orange-200 border-orange-400/40'
        }
      };

      // Detecta automaticamente o tema da cor com base no nome do cartão
      function detectBankTheme(cardName, fallbackTheme) {
        if (fallbackTheme && BANK_THEMES[fallbackTheme]) return fallbackTheme;
        const n = (cardName || '').toLowerCase();
        if (n.includes('samsung')) return 'samsung';
        if (n.includes('amazon')) return 'amazon';
        if (n.includes('itau') || n.includes('itaú')) return 'itau';
        if (n.includes('bradesco')) return 'bradesco';
        if (n.includes('nubank') || n.includes('roxinho') || n.includes('ultra')) return 'nubank';
        if (n.includes('inter')) return 'inter';
        if (n.includes('c6')) return 'c6';
        if (n.includes('santander')) return 'santander';
        if (n.includes('brasil') || n.includes('bb')) return 'bb';
        if (n.includes('caixa')) return 'caixa';
        return 'c6';
      }

      // Dados padrão com os 4 cartões reais do usuário (Itaú, Bradesco, Amazon, Samsung)
      const DEFAULT_DATA = {
        boxes: [
          { id: '1', name: 'Salário / Geral', limit: 5000, color: '#6366f1', icon: '💼', isMain: true },
          { id: '2', name: 'Alimentação', limit: 1200, color: '#10b981', icon: '🍔', isMain: false },
          { id: '3', name: 'Transporte', limit: 400, color: '#f59e0b', icon: '🚗', isMain: false },
          { id: '4', name: 'Lazer e Streaming', limit: 500, color: '#ec4899', icon: '🎮', isMain: false },
          { id: '5', name: 'Saúde e Farmácia', limit: 350, color: '#06b6d4', icon: '💊', isMain: false }
        ],
        creditCards: [
          { id: 'card-itau', name: 'Itaú Mastercard', limit: 4000, brand: 'Mastercard', theme: 'itau', cvv: '584', isBlocked: false },
          { id: 'card-bradesco', name: 'Bradesco Visa', limit: 3000, brand: 'Visa', theme: 'bradesco', cvv: '312', isBlocked: false },
          { id: 'card-amazon', name: 'Amazon Bradesco', limit: 2500, brand: 'Visa', theme: 'amazon', cvv: '849', isBlocked: false },
          { id: 'card-samsung', name: 'Samsung Itaú', limit: 5000, brand: 'Visa Platinum', theme: 'samsung', cvv: '471', isBlocked: false }
        ],
        transactions: [
          { id: 1, desc: 'Salário Mensal', value: 5000, type: 'receita', boxId: '1', category: 'Salário', payment: 'Pix', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 2, desc: 'Supermercado Mensal', value: 480, type: 'despesa', boxId: '2', category: 'Supermercado', payment: 'Cartão de Crédito', cardId: 'card-itau', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 3, desc: 'Combustível Posto', value: 160, type: 'despesa', boxId: '3', category: 'Transporte', payment: 'Débito', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
          { id: 4, desc: 'Notebook Dell (3/10)', value: 250, type: 'despesa', boxId: '1', category: 'Compras Parceladas', payment: 'Cartão de Crédito', cardId: 'card-amazon', date: new Date().toISOString().slice(0, 10), year: new Date().getFullYear(), month: new Date().getMonth() + 1 }
        ],
        savingsGoals: [
          { id: 1, name: 'Reserva de Emergência', targetValue: 15000, currentValue: 6500, color: '#10b981', icon: '🛡️' },
          { id: 2, name: 'Viagem de Fim de Ano', targetValue: 5000, currentValue: 1800, color: '#06b6d4', icon: '✈️' }
        ],
        recurringBills: [
          { id: '1', name: 'Netflix 4K Ultra', value: 55.90, dueDay: 12, icon: '🍿' },
          { id: '2', name: 'Spotify Duo', value: 34.90, dueDay: 20, icon: '🎵' },
          { id: '3', name: 'Internet Fibra 600MB', value: 129.90, dueDay: 10, icon: '🌐' }
        ]
      };

      // Carregador seguro: garante que arrays nunca sejam undefined
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
          const parsed = JSON.parse(raw);

          // Se veio de formato antigo ou incompleto, mescla com os padrões de forma segura
          const finalCards = Array.isArray(parsed.creditCards) && parsed.creditCards.length > 0
            ? parsed.creditCards
            : DEFAULT_DATA.creditCards;

          // Assegura que cada cartão tenha um tema definido
          finalCards.forEach(c => {
            if (!c.theme) c.theme = detectBankTheme(c.name, c.skin);
          });

          return {
            boxes: Array.isArray(parsed.boxes) && parsed.boxes.length > 0 ? parsed.boxes : DEFAULT_DATA.boxes,
            creditCards: finalCards,
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : DEFAULT_DATA.transactions,
            savingsGoals: Array.isArray(parsed.savingsGoals) && parsed.savingsGoals.length > 0 ? parsed.savingsGoals : DEFAULT_DATA.savingsGoals,
            recurringBills: Array.isArray(parsed.recurringBills) && parsed.recurringBills.length > 0 ? parsed.recurringBills : DEFAULT_DATA.recurringBills
          };
        } catch (e) {
          console.error('Falha ao carregar dados:', e);
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
      }

      const state = {
        data: loadData(),
        currentYear: new Date().getFullYear(),
        currentMonth: new Date().getMonth() + 1,
        currentTab: 'painel',
        privacyMode: false,
        darkMode: false,
        themeConfig: {
          type: 'solid',
          solidColor: '#f8fafc',
          bgName: 'Branco Clean',
          customImage: '',
          imageOpacity: 0.85,
          imageBlur: 0,
          isDark: false
        },
        revealedCvv: {},
        showSimulator: false,
        simDiscount: 5,
        simCdi: 0.9,
        newTransType: 'despesa'
      };

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        } catch (e) {
          console.error('Erro ao salvar no localStorage:', e);
        }
      }

      function formatMoeda(num) {
        if (state.privacyMode) return 'R$ ••••••';
        return (Number(num) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      let toastTimeout = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.remove('hidden');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.add('hidden');
        }, 3000);
      }

      const phoneFrame = document.getElementById('phone-frame');
      const viewContent = document.getElementById('view-content');
      const monthLabel = document.getElementById('month-label');
      const btnPrivacy = document.getElementById('btn-privacy');
      const btnTheme = document.getElementById('btn-theme');
      const btnPrevMonth = document.getElementById('btn-prev-month');
      const btnNextMonth = document.getElementById('btn-next-month');
      const tabButtons = document.querySelectorAll('.tab-btn');
      const modalContainer = document.getElementById('modal-container');
      const modalBox = document.getElementById('modal-box');

      if (btnPrivacy) {
        btnPrivacy.addEventListener('click', () => {
          state.privacyMode = !state.privacyMode;
          btnPrivacy.textContent = state.privacyMode ? '🙈' : '👁️';
          render();
        });
      }

      if (btnTheme) {
        btnTheme.addEventListener('click', () => {
          state.darkMode = !state.darkMode;
          if (state.darkMode) {
            phoneFrame.classList.add('dark');
            btnTheme.textContent = '☀️';
          } else {
            phoneFrame.classList.remove('dark');
            btnTheme.textContent = '🌙';
          }
        });
      }

      if (btnPrevMonth) {
        btnPrevMonth.addEventListener('click', () => {
          if (state.currentMonth === 1) {
            state.currentMonth = 12;
            state.currentYear--;
          } else {
            state.currentMonth--;
          }
          render();
        });
      }

      if (btnNextMonth) {
        btnNextMonth.addEventListener('click', () => {
          if (state.currentMonth === 12) {
            state.currentMonth = 1;
            state.currentYear++;
          } else {
            state.currentMonth++;
          }
          render();
        });
      }

      tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentTab = btn.getAttribute('data-tab');
          tabButtons.forEach(b => {
            const isCur = b.getAttribute('data-tab') === state.currentTab;
            b.className = 'tab-btn flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all cursor-pointer ' +

        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);

        const cartao = monthTrans.filter(t => t.type === 'despesa' && t.payment === 'Cartão de Crédito').reduce((a, b) => a + (Number(b.value) || 0), 0);
        const sobra = rec - desp;

        const lines = [
          '📊 *Resumo Financeiro - ' + MONTHS[state.currentMonth - 1] + ' / ' + state.currentYear + '*',
          '━━━━━━━━━━━━━━━━━━━━━━━━━',

          '━━━━━━━━━━━━━━━━━━━━━━━━━',
          '📑 *Lançamentos (' + monthTrans.length + '):*',

          'Gerado por Finanças Pro Mobile ✨'

        const text = lines.join('\n');
        if (navigator.clipboard) {

      window.exportCSV = function () {
        const monthTrans = state.data.transactions.filter(t => t.year === state.currentYear && t.month === state.currentMonth);
        if (monthTrans.length === 0) return alert('Nenhum lançamento no mês!');
        const rows = [
          ['Data', 'Descricao', 'Tipo', 'Categoria', 'Forma', 'Valor'],
          ...monthTrans.map(t => [t.date, t.desc, t.type, t.category, t.payment, Number(t.value || 0).toFixed(2)])
        ];
        const csvContent = '\uFEFF' + rows.map(e => e.join(';')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'extrato_' + state.currentMonth + '_' + state.currentYear + '.csv';
        link.click();
        URL.revokeObjectURL(url);
        showToast('Planilha CSV baixada! 📊');
      };

          const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 300);
          showToast('Ficheiro index.html descarregado no celular! 🚀');
        } catch (e) {

            const simIndicator = document.getElementById('sim-indicator');
            const simDiscountInput = document.getElementById('sim-discount-input');
            const simCdiInput = document.getElementById('sim-cdi-input');
            const simVerdict = document.getElementById('sim-verdict');
            const inputValor = document.getElementById('input-valor');
            const inputParcelas = document.getElementById('input-parcelas');
            const inputPagamento = document.getElementById('input-pagamento');
            const cardContainer = document.getElementById('card-select-container');

            if (btnDesp && btnRec) {
              btnDesp.addEventListener('click', () => {
                state.newTransType = 'despesa';
                btnDesp.className = 'py-2 rounded-xl text-xs font-black bg-rose-500 text-white shadow-md transition-all cursor-pointer';
                btnRec.className = 'py-2 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer';
              });

              btnRec.addEventListener('click', () => {
                state.newTransType = 'receita';
                btnRec.className = 'py-2 rounded-xl text-xs font-black bg-emerald-500 text-white shadow-md transition-all cursor-pointer';
                btnDesp.className = 'py-2 rounded-xl text-xs font-black bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer';
              });
            }

            if (inputPagamento && cardContainer) {
              inputPagamento.addEventListener('change', () => {
                if (inputPagamento.value === 'Cartão de Crédito') {
                  cardContainer.classList.remove('hidden');
                } else {
                  cardContainer.classList.add('hidden');
                }
              });
            }

            function updateSimulator() {
              if (!inputValor || !simVerdict) return;
              const val = parseFloat(inputValor.value) || 0;
              const parcelas = parseInt(inputParcelas.value, 10) || 1;
              const desc = parseFloat(simDiscountInput.value) || 0;
              const cdi = parseFloat(simCdiInput.value) || 0;

              if (val > 0) {
                const economiaAvista = val * (desc / 100);
                const rendimentoCdi = val * ((cdi / 100) * (parcelas / 2));
                const valeAvista = economiaAvista >= rendimentoCdi;

                simVerdict.innerHTML = `
                  <div>💡 Desconto à vista: <b>${formatMoeda(economiaAvista)}</b></div>
                  <div>📈 Rende no CDI (${parcelas}x): <b>~${formatMoeda(rendimentoCdi)}</b></div>
                  <div class="mt-1.5 p-1.5 rounded-lg text-center ${valeAvista ? 'bg-emerald-500/20 text-emerald-400' : 'bg-indigo-500/20 text-indigo-400'}">
                    ${valeAvista ? '🏆 Recomendação: Pague À VISTA com desconto!' : '🏆 Recomendação: PARCELE sem juros e deixe no CDI!'}
                  </div>
                `;
              } else {
                simVerdict.textContent = 'Informe o valor acima para comparar a economia do desconto com o ganho no CDI.';
              }
            }

            if (btnToggleSim && simBox && simIndicator) {
              btnToggleSim.addEventListener('click', () => {
                state.showSimulator = !state.showSimulator;
                simBox.classList.toggle('hidden', !state.showSimulator);
                simIndicator.textContent = state.showSimulator ? 'Fechar' : 'Calcular';
                if (state.showSimulator) updateSimulator();
              });
            }

            if (inputValor) inputValor.addEventListener('input', updateSimulator);
            if (inputParcelas) inputParcelas.addEventListener('change', updateSimulator);
            if (simDiscountInput) simDiscountInput.addEventListener('input', updateSimulator);
            if (simCdiInput) simCdiInput.addEventListener('input', updateSimulator);

            if (form) {
              form.addEventListener('submit', (e) => {
                e.preventDefault();
                const desc = document.getElementById('input-desc').value.trim();
                const val = parseFloat(document.getElementById('input-valor').value);
                const parcelas = parseInt(document.getElementById('input-parcelas').value, 10) || 1;
                const boxId = document.getElementById('input-caixinha').value;
                const payment = document.getElementById('input-pagamento').value;
                const cardId = document.getElementById('input-cartao')?.value;

                if (!desc || isNaN(val) || val <= 0) {
                  showToast('Informe a descrição e valor válidos!');
                  return;
                }

                if (payment === 'Cartão de Crédito') {
                  const cardObj = state.data.creditCards.find(c => c.id === cardId);
                  if (cardObj && cardObj.isBlocked) {
                    showToast('⚠️ O cartão "' + cardObj.name + '" está bloqueado!');
                    return;
                  }
                }

                const valorPorParcela = +(val / parcelas).toFixed(2);
                for (let i = 0; i < parcelas; i++) {
                  let lancMes = state.currentMonth + i;
                  let lancAno = state.currentYear;
                  while (lancMes > 12) {
                    lancMes -= 12;
                    lancAno++;
                  }
                  state.data.transactions.unshift({
                    id: Date.now() + i,
                    desc: parcelas > 1 ? desc + ' (' + (i + 1) + '/' + parcelas + ')' : desc,
                    value: valorPorParcela,
                    type: state.newTransType,
                    boxId,
                    category: 'Geral',
                    payment,
                    cardId: payment === 'Cartão de Crédito' ? cardId : undefined,
                    date: new Date().toISOString().slice(0, 10),
                    year: lancAno,
                    month: lancMes
                  });
                }

                saveData();
                showToast(parcelas > 1 ? parcelas + ' parcelas cadastradas!' : 'Lançamento salvo!');
                render();
              });
            }
          }
        } catch (err) {

            viewContent.innerHTML = `
              <div class="p-5 rounded-3xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-center space-y-3">

    function loadThemeConfig() {
      try {
        const saved = localStorage.getItem(THEME_STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Erro ao carregar tema:', e);
      }
      return {
        type: 'solid',
        solidColor: '#f8fafc',
        bgName: 'Branco Neve',
        customImage: '',
        imageOpacity: 0.85,
        imageBlur: 0,
        isDark: false
      };
    }

    function saveThemeConfig(config) {
      try {
        localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(config));
      } catch (e) {
        console.warn('Erro ao salvar tema:', e);
      }
    }

    let currentTheme = loadThemeConfig();

    function applyThemeToDOM(config) {
      const phoneFrame = document.getElementById('phone-frame');
      const bgImage = document.getElementById('custom-bg-image');
      const bgOverlay = document.getElementById('custom-bg-overlay');
      if (!phoneFrame) return;

      if (config.isDark) {
        phoneFrame.classList.add('dark');
        document.body.classList.remove('bg-slate-200');
        document.body.classList.add('bg-slate-900');
      } else {
        phoneFrame.classList.remove('dark');
        document.body.classList.remove('bg-slate-900');
        document.body.classList.add('bg-slate-200');
      }

      if (config.type === 'image' && config.customImage) {
        if (bgImage && bgOverlay) {
          bgImage.style.display = 'block';
          bgImage.style.backgroundImage = `url("${config.customImage}")`;
          bgImage.style.filter = `blur(${config.imageBlur || 0}px)`;

          bgOverlay.style.display = 'block';
          const overlayColor = config.isDark ? 'rgba(11, 15, 25,' : 'rgba(255, 255, 255,';
          bgOverlay.style.backgroundColor = `${overlayColor} ${config.imageOpacity !== undefined ? config.imageOpacity : 0.85})`;
        }
        phoneFrame.style.backgroundColor = 'transparent';
      } else {
        if (bgImage) bgImage.style.display = 'none';
        if (bgOverlay) bgOverlay.style.display = 'none';
        phoneFrame.style.backgroundColor = config.solidColor || '#f8fafc';
      }
    }

    window.setSolidColor = function(color, name, isDark) {

    window.setCustomSolidColorPicker = function(inputEl) {
      const color = inputEl.value;
      const r = parseInt(color.substr(1,2),16);
      const g = parseInt(color.substr(3,2),16);
      const b = parseInt(color.substr(5,2),16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      const isDark = brightness < 128;

      currentTheme.type = 'solid';
      currentTheme.solidColor = color;
      currentTheme.bgName = 'Cor Personalizada';
      currentTheme.isDark = isDark;
      saveThemeConfig(currentTheme);
      applyThemeToDOM(currentTheme);
      showToast('Cor sólida personalizada aplicada! ✨');
      if (state && state.currentTab === 'mais') render();
    };

    window.applyPresetPhoto = function(url, name) {

      showToast(`Foto aplicada: ${currentTheme.bgName}! Clique em "Salvar Foto" para confirmar. 📸`);

    window.uploadCustomBgImage = function(fileInput) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const rawImg = new Image();
        rawImg.onload = function() {
          const canvas = document.createElement('canvas');
          let width = rawImg.width;
          let height = rawImg.height;
          const maxDim = 850;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(rawImg, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.80);
          currentTheme.type = 'image';
          currentTheme.customImage = compressedDataUrl;
          currentTheme.bgName = 'Minha Foto (Galeria)';
          applyThemeToDOM(currentTheme);
          showToast('Foto carregada da galeria! Clique em "Salvar Foto" para confirmar. 📸');
          openModalTemas();
        };
        rawImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.trancarApp = function() {

      const telaBloqueio = document.getElementById('tela-bloqueio-app');
      const inputPin = document.getElementById('input-pin-app');
      const erroPin = document.getElementById('erro-pin-app');
      if (telaBloqueio) {

        if (inputPin) {
          inputPin.value = '';
          inputPin.focus();
        }
        if (erroPin) erroPin.classList.add('hidden');
      }
      showToast('Aplicativo bloqueado com segurança! 🔒');
    };

    window.desbloquearAppComPin = function() {
      const inputPin = document.getElementById('input-pin-app');
      const erroPin = document.getElementById('erro-pin-app');
      const telaBloqueio = document.getElementById('tela-bloqueio-app');
      const pinSalvo = localStorage.getItem('financas_app_pin') || '1234';

      if (inputPin && (inputPin.value === pinSalvo || inputPin.value === '1234')) {
        sessionStorage.setItem(LOCK_SESSION_KEY, 'true');
        if (telaBloqueio) telaBloqueio.classList.add('hidden');
        showToast('Desbloqueado com sucesso! 👋');
      } else {
        if (erroPin) erroPin.classList.remove('hidden');
      }
    };

    window.desbloquearAppComBiometria = async function() {
      try {
        if (window.PublicKeyCredential) {
          sessionStorage.setItem(LOCK_SESSION_KEY, 'true');
          const telaBloqueio = document.getElementById('tela-bloqueio-app');
          if (telaBloqueio) telaBloqueio.classList.add('hidden');
          showToast('Desbloqueado por Biometria! 👆');
          return;

      } catch (e) {}
      sessionStorage.setItem(LOCK_SESSION_KEY, 'true');
      const telaBloqueio = document.getElementById('tela-bloqueio-app');
      if (telaBloqueio) telaBloqueio.classList.add('hidden');
      showToast('Acesso liberado pelo dispositivo! 🔓');

        if (tela) tela.classList.add('hidden');
